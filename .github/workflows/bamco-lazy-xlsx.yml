name: One-shot BAMCO lazy XLSX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bamco-lazy-xlsx.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Defer XLSX compilation until first Excel action
        id: optimize
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('index.html','utf8');
          const before=Buffer.byteLength(html);
          const one=(oldText,newText,label)=>{const n=html.split(oldText).length-1;if(n!==1)throw new Error(`${label}: expected 1 occurrence, found ${n}`);html=html.replace(oldText,newText)};
          const many=(oldText,newText,count,label)=>{const n=html.split(oldText).length-1;if(n!==count)throw new Error(`${label}: expected ${count} occurrences, found ${n}`);html=html.split(oldText).join(newText)};

          const vendor=/<script>\s*\/\* vendor-xlsx\.min\.js \*\/([\s\S]*?)<\/script>/;
          const m=html.match(vendor);
          if(!m)throw new Error('embedded XLSX script not found');
          if((html.match(/vendor-xlsx\.min\.js/g)||[]).length!==1)throw new Error('embedded XLSX marker is not unique');
          let source=m[1].replace(/\n?\/\/# sourceMappingURL=xlsx\.min\.js\.map\s*$/,'').trim();
          new Function(source);
          const sourceBytes=Buffer.byteLength(source);
          const loader=`<script type="application/bamco-xlsx-source" id="bamcoXlsxSource">${source}</script>\n<script>window.ensureBamcoXLSX=function(){if(window.XLSX)return window.XLSX;const n=document.getElementById('bamcoXlsxSource');if(!n)throw new Error('منبع داخلی Excel پیدا نشد.');const s=document.createElement('script');s.text=n.textContent;(document.head||document.documentElement).appendChild(s);s.remove();if(!window.XLSX)throw new Error('کتابخانه Excel فعال نشد.');n.textContent='';return window.XLSX};</script>`;
          html=html.replace(vendor,loader);

          const parseOld=`async function parse(file){\n  if(typeof XLSX==='undefined')throw new Error('کتابخانه Excel بارگذاری نشده است؛ صفحه را تازه‌سازی کنید.');\n  const wb=XLSX.read`;
          const parseNew=`async function parse(file){\n  const XLSX=window.ensureBamcoXLSX();\n  const wb=XLSX.read`;
          one(parseOld,parseNew,'main Excel import');

          const exportGuard=`if(typeof XLSX==='undefined')return toast('کتابخانه Excel بارگذاری نشده است؛ صفحه را تازه‌سازی کنید.',true);`;
          many(exportGuard,`const XLSX=window.ensureBamcoXLSX();`,2,'task Excel exports');

          const vehicleExportOld=`function exportWorkbook(scope){if(!window.XLSX)return toast('کتابخانه ساخت خروجی اکسل بارگذاری نشده است؛ صفحه را تازه‌سازی کنید.',true);`;
          const vehicleExportNew=`function exportWorkbook(scope){const XLSX=window.ensureBamcoXLSX();`;
          one(vehicleExportOld,vehicleExportNew,'vehicle Excel export');

          const vehicleImportOld=`async function importWorkbook(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;if(!window.XLSX)return toast('کتابخانه خواندن اکسل بارگذاری نشده است؛ صفحه را تازه‌سازی کنید.',true);try{const workbook=XLSX.read`;
          const vehicleImportNew=`async function importWorkbook(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const XLSX=window.ensureBamcoXLSX();const workbook=XLSX.read`;
          one(vehicleImportOld,vehicleImportNew,'vehicle Excel import');

          one(`if(typeof v==='number'&&XLSX?.SSF){const d=XLSX.SSF.parse_date_code(v);`,`if(typeof v==='number'&&window.XLSX?.SSF){const d=window.XLSX.SSF.parse_date_code(v);`,'numeric Excel date guard');

          const inert=[...html.matchAll(/<script\s+type="application\/bamco-xlsx-source"[^>]*>([\s\S]*?)<\/script>/gi)];
          if(inert.length!==1)throw new Error('lazy XLSX source block invalid');
          if(!html.includes('window.ensureBamcoXLSX=function()'))throw new Error('XLSX loader missing');
          if(!html.includes('data-login-controls')||!html.includes('taskTimelineView')||!html.includes('vehiclePermanentView')||!html.includes('SB_URL'))throw new Error('required app feature marker missing');

          const scripts=[...html.matchAll(/<script(?![^>]*type="application\/bamco-xlsx-source")[^>]*>([\s\S]*?)<\/script>/gi)];
          for(let i=0;i<scripts.length;i++){const code=scripts[i][1];if(!code.trim())continue;try{new Function(code)}catch(e){throw new Error(`inline script ${i+1} syntax error: ${e.message}`)}}
          if(!/^<!doctype html>/i.test(html.trimStart())||!/<\/html>\s*$/i.test(html.trimEnd()))throw new Error('HTML envelope invalid');

          fs.writeFileSync('index.html',html);
          fs.writeFileSync('/tmp/xlsx-lazy-test.html',`<!doctype html><html><head><meta charset="utf-8"><script type="application/bamco-xlsx-source" id="bamcoXlsxSource">${source}</script><script>window.ensureBamcoXLSX=function(){if(window.XLSX)return window.XLSX;const n=document.getElementById('bamcoXlsxSource');const s=document.createElement('script');s.text=n.textContent;document.head.appendChild(s);s.remove();if(!window.XLSX)throw new Error('XLSX missing');return window.XLSX};</script></head><body><div id="result"></div><script>try{const x=ensureBamcoXLSX();document.getElementById('result').textContent='XLSX_OK:'+x.version}catch(e){document.getElementById('result').textContent='XLSX_FAIL:'+e.message}</script></body></html>`);
          console.log(`before_bytes=${before}`);
          console.log(`after_bytes=${Buffer.byteLength(html)}`);
          console.log(`deferred_xlsx_source_bytes=${sourceBytes}`);
          console.log('xlsx_initial_execution=deferred');
          NODE
          test -f .nojekyll
          test ! -s .nojekyll
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --dump-dom file:///tmp/xlsx-lazy-test.html 2>/dev/null | grep -q 'XLSX_OK:'
            echo "lazy_xlsx_browser_test=OK"
          else
            echo "lazy_xlsx_browser_test=SKIPPED_NO_CHROME"
          fi
          git diff --check

      - name: Commit result and remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/bamco-lazy-xlsx.yml
          if [ "${{ steps.optimize.outcome }}" = "success" ]; then
            git add index.html
            git commit -m "perf: defer embedded XLSX until Excel is used"
          else
            git restore --staged index.html 2>/dev/null || true
            git checkout -- index.html 2>/dev/null || true
            git commit -m "chore: remove failed lazy-XLSX optimizer"
          fi
          git push
