name: Performance report root fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-report-root-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch canonical performance report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/report-stability-fixes-20260911.js')
          s=p.read_text()

          s=s.replace("if(window.__bamcoCanonicalReportsLiveSyncV3)return;\nwindow.__bamcoCanonicalReportsLiveSyncV3=true;",
                      "if(window.__bamcoCanonicalReportsLiveSyncV4)return;\nwindow.__bamcoCanonicalReportsLiveSyncV4=true;\nwindow.__bamcoCanonicalReportsLiveSyncV3=true;",1)

          old_css=''' .canonical-report-tools{display:flex!important;align-items:center!important;gap:9px!important;flex-wrap:wrap!important;margin:0 0 12px}\n .canonical-report-tools>input[type=search]{min-width:220px;flex:1 1 260px}\n .canonical-date-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}\n .canonical-date-controls label{display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap}\n .canonical-date-field{display:grid;grid-template-columns:minmax(128px,158px) 38px;gap:5px;align-items:center}\n .canonical-date-field input{height:38px;border:1px solid #c7d5cf;border-radius:8px;background:#fff;padding:0 9px;text-align:center;font-family:"B Nazanin",BNazanin,Tahoma,sans-serif}\n .canonical-date-field button{height:38px;width:38px;padding:0}\n .canonical-report .workspace-table{border-collapse:collapse!important;border-spacing:0!important;width:100%}\n .canonical-report .workspace-table th,.canonical-report .workspace-table td{border:1px solid #cbd9d3!important}\n .canonical-report .empty{text-align:center!important;padding:28px!important;color:#71867d}\n .canonical-report .completion-cell{min-width:145px}\n'''
          new_css=''' .canonical-report-tools{display:flex!important;align-items:center!important;gap:9px!important;flex-wrap:wrap!important;margin:0 0 12px}\n .canonical-report-tools>input[type=search]{min-width:220px;flex:1 1 260px}\n .canonical-date-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}\n .canonical-date-controls label{display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap}\n .canonical-date-field{display:grid;grid-template-columns:minmax(128px,158px) 38px;gap:5px;align-items:center}\n .canonical-date-field input{height:38px;border:1px solid #c7d5cf;border-radius:8px;background:#fff;padding:0 9px;text-align:center;font-family:"B Nazanin",BNazanin,Tahoma,sans-serif}\n .canonical-date-field button{height:38px;width:38px;padding:0}\n .canonical-report .workspace-table{border-collapse:collapse!important;border-spacing:0!important;width:100%}\n .canonical-report .workspace-table th,.canonical-report .workspace-table td{border:1px solid #cbd9d3!important}\n .canonical-report .empty{text-align:center!important;padding:28px!important;color:#71867d}\n .canonical-report .completion-cell{min-width:155px}\n #performanceReportView>.bamco-page-heading,#performanceReportView>.bamco-management-toolbar{display:none!important}\n #performanceReportView .canonical-report-tools{display:block!important;margin:0 0 10px!important}\n #performanceReportView .performance-command-row{display:flex!important;align-items:center!important;gap:8px!important;flex-wrap:nowrap!important;overflow-x:auto!important;padding:2px 0 7px!important;scrollbar-width:thin}\n #performanceReportView .performance-command-row>*{flex:0 0 auto!important}\n #performanceReportView .performance-command-row button,#performanceReportView .performance-command-row label,#performanceReportView .performance-command-row label>span{font-family:"B Nazanin",BNazanin,Tahoma,sans-serif!important;font-weight:400!important}\n #performanceReportView .performance-command-row button{white-space:nowrap!important}\n #performanceReportView .performance-command-row .canonical-date-controls{display:contents!important}\n #performanceReportView .performance-search-row{display:flex!important;align-items:center!important;justify-content:flex-start!important;margin-top:2px!important}\n #performanceReportView .performance-search-row input[type=search]{width:min(520px,100%)!important;min-width:260px!important;font-family:"B Nazanin",BNazanin,Tahoma,sans-serif!important;font-weight:400!important}\n #performanceReportView .completion-cell{padding:6px 8px!important}\n #performanceReportView .performance-progress{position:relative!important;height:22px!important;min-width:138px!important;border:1px solid #c8d6d0!important;border-radius:999px!important;background:#edf2ef!important;overflow:hidden!important;isolation:isolate!important}\n #performanceReportView .performance-progress>i{position:absolute!important;top:0!important;bottom:0!important;right:0!important;width:var(--p,0%)!important;z-index:0!important;transition:width .18s ease!important}\n #performanceReportView .performance-progress>span{position:absolute!important;inset:0!important;display:grid!important;place-items:center!important;z-index:1!important;font-family:"B Nazanin",BNazanin,Tahoma,sans-serif!important;font-weight:400!important;color:#173f33!important;text-shadow:0 1px 0 rgba(255,255,255,.75)!important}\n #performanceReportView .performance-progress.high>i{background:#58ad78!important}\n #performanceReportView .performance-progress.medium>i{background:#72b5ad!important}\n #performanceReportView .performance-progress.warning>i{background:#e4b45e!important}\n #performanceReportView .performance-progress.low>i{background:#db7a73!important}\n'''
          assert old_css in s
          s=s.replace(old_css,new_css,1)

          s=s.replace("function markReportOwners(){for(const id of ['performanceReportView','responseReportView']){const view=q('#'+id);if(view)view.dataset.canonicalReportOwner='3'}}",
                      "function markReportOwners(){for(const id of ['performanceReportView','responseReportView']){const view=q('#'+id);if(view)view.dataset.canonicalReportOwner='4'}}",1)

          old_tools='''function perfTools(range){return `<div class="canonical-report-tools"><div class="canonical-date-controls"><label><span>تاریخ شروع</span><span class="canonical-date-field"><input id="canonicalPerfFrom" data-performance-from class="jalali-input" readonly value="${esc(range?.fromText||'')}"><button type="button" class="ghost" data-canonical-date="perf-from">▦</button></span></label><label><span>تاریخ پایان</span><span class="canonical-date-field"><input id="canonicalPerfTo" data-performance-to class="jalali-input" readonly value="${esc(range?.toText||'')}"><button type="button" class="ghost" data-canonical-date="perf-to">▦</button></span></label><button type="button" class="ghost" data-canonical-perf-clear data-performance-clear>حذف بازه</button></div><input id="canonicalPerfSearch" type="search" placeholder="جست‌وجو در گزارش…"><button type="button" class="ghost" data-canonical-refresh="performanceReport">تازه‌سازی</button><button type="button" class="ghost" data-canonical-export="performance">خروجی اکسل</button></div>`}'''
          new_tools='''function perfTools(range){return `<div class="canonical-report-tools"><div class="performance-command-row"><button type="button" class="ghost" data-performance-home>بازگشت به خانه</button><div class="canonical-date-controls"><label><span>تاریخ شروع</span><span class="canonical-date-field"><input id="canonicalPerfFrom" data-performance-from class="jalali-input" readonly value="${esc(range?.fromText||'')}"><button type="button" class="ghost" data-canonical-date="perf-from" aria-label="انتخاب تاریخ شروع">▦</button></span></label><label><span>تاریخ پایان</span><span class="canonical-date-field"><input id="canonicalPerfTo" data-performance-to class="jalali-input" readonly value="${esc(range?.toText||'')}"><button type="button" class="ghost" data-canonical-date="perf-to" aria-label="انتخاب تاریخ پایان">▦</button></span></label><button type="button" class="ghost" data-canonical-perf-clear data-performance-clear>حذف بازه</button></div><button type="button" class="ghost" data-canonical-refresh="performanceReport">تازه‌سازی</button><button type="button" class="ghost" data-canonical-export="performance">خروجی اکسل فیلترشده</button></div><div class="performance-search-row"><input id="canonicalPerfSearch" type="search" placeholder="جست‌وجو در گزارش…"></div></div>`}'''
          assert old_tools in s
          s=s.replace(old_tools,new_tools,1)

          old_render=''' const headers=['شناسه متولی','متولی','کل واگذارشده','فعال','هشدار','دیرکرد',defaultRange?'محول‌شده در این ماه':'محول‌شده در بازه',defaultRange?'انجام‌شده در این ماه':'انجام‌شده در بازه','درصد تکمیل',defaultRange?'درخواست تعریف وظیفه این ماه':'درخواست تعریف وظیفه در بازه'];\n table.tHead.innerHTML='<tr>'+headers.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>';\n table.tBodies[0].innerHTML=ids.map((id,i)=>{const all=tasks.filter(t=>String(t.owner_id)===String(id)),active=all.filter(t=>!t.archived&&!terminal(t)),due=all.filter(t=>t.due_date&&(!from||String(t.due_date).slice(0,10)>=from)&&(!to||String(t.due_date).slice(0,10)<=to)),done=due.filter(completed),pct=due.length?Math.round(done.length/due.length*100):0,req=requests.filter(r=>String(r.requested_by)===String(id)).length;return `<tr data-canonical-row="1" data-workspace-index="${i}"><td>${esc(id)}</td><td>${esc(personName(id))}</td><td>${digits(all.length)}</td><td>${digits(active.length)}</td><td>${digits(active.filter(t=>temporal(t)==='دوره هشدار').length)}</td><td>${digits(active.filter(t=>temporal(t)==='دیرکرد').length)}</td><td>${digits(due.length)}</td><td>${digits(done.length)}</td><td class="completion-cell">${digits(pct)}٪</td><td>${digits(req)}</td></tr>`}).join('')||'<tr><td colspan="10" class="empty">رکوردی ثبت نشده است.</td></tr>';bindSearch('#canonicalPerfSearch','#performanceReportView');'''
          new_render=''' const headers=['متولی','کل واگذارشده','فعال','هشدار','دیرکرد',defaultRange?'محول‌شده در این ماه':'محول‌شده در بازه',defaultRange?'انجام‌شده در این ماه':'انجام‌شده در بازه','درصد تکمیل',defaultRange?'درخواست تعریف وظیفه این ماه':'درخواست تعریف وظیفه در بازه'];\n table.tHead.innerHTML='<tr>'+headers.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>';\n table.tBodies[0].innerHTML=ids.map((id,i)=>{const all=tasks.filter(t=>String(t.owner_id)===String(id)),active=all.filter(t=>!t.archived&&!terminal(t)),due=all.filter(t=>t.due_date&&(!from||String(t.due_date).slice(0,10)>=from)&&(!to||String(t.due_date).slice(0,10)<=to)),done=due.filter(completed),pct=due.length?Math.round(done.length/due.length*100):0,level=pct>=80?'high':pct>=60?'medium':pct>=40?'warning':'low',req=requests.filter(r=>String(r.requested_by)===String(id)).length;return `<tr data-canonical-row="1" data-workspace-index="${i}"><td>${esc(personName(id))}</td><td>${digits(all.length)}</td><td>${digits(active.length)}</td><td>${digits(active.filter(t=>temporal(t)==='دوره هشدار').length)}</td><td>${digits(active.filter(t=>temporal(t)==='دیرکرد').length)}</td><td>${digits(due.length)}</td><td>${digits(done.length)}</td><td class="completion-cell"><div class="performance-progress ${level}" style="--p:${Math.max(0,Math.min(100,pct))}%"><i></i><span>${digits(pct)}٪</span></div></td><td>${digits(req)}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">رکوردی ثبت نشده است.</td></tr>';bindSearch('#canonicalPerfSearch','#performanceReportView');'''
          assert old_render in s
          s=s.replace(old_render,new_render,1)

          old_export="async function exportReport(kind){const view=q(kind==='performance'?'#performanceReportView':'#responseReportView'),table=q('table',view);if(!table)return;const rows=[...table.rows].filter(r=>!r.hidden).map(r=>[...r.cells].map(c=>c.textContent.trim())),X=await window.ensureBamcoXLSX(),ws=X.utils.aoa_to_sheet(rows),wb=X.utils.book_new();ws['!views']=[{rightToLeft:true}];wb.Workbook={Views:[{RTL:true}]};X.utils.book_append_sheet(wb,ws,kind==='performance'?'گزارش عملکرد':'گزارش پاسخ‌ها');X.writeFile(wb,(kind==='performance'?'گزارش عملکرد':'گزارش پاسخ‌ها')+'.xlsx',{compression:true})}"
          new_export="async function exportReport(kind){const view=q(kind==='performance'?'#performanceReportView':'#responseReportView'),table=q('table',view);if(!table)return;const rows=[...table.rows].filter(r=>!r.hidden).map(r=>[...r.cells].map(c=>c.textContent.trim()));if(!rows.length)return;const X=await window.ensureBamcoXLSX(),ws=X.utils.aoa_to_sheet(rows),wb=X.utils.book_new();ws['!views']=[{rightToLeft:true}];ws['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(0,rows.length-1),c:Math.max(0,rows[0].length-1)}})};ws['!cols']=rows[0].map((_,i)=>({wch:i===0?24:i===7?18:16}));wb.Workbook={Views:[{RTL:true}]};X.utils.book_append_sheet(wb,ws,kind==='performance'?'گزارش عملکرد':'گزارش پاسخ‌ها');X.writeFile(wb,(kind==='performance'?'گزارش عملکرد فیلترشده':'گزارش پاسخ‌ها')+'.xlsx',{compression:true})}"
          assert old_export in s
          s=s.replace(old_export,new_export,1)

          s=s.replace("if(tabs.__canonicalReportsV3)return true;tabs.render=(id,...args)=>id==='performanceReport'?renderPerformance(false):id==='responseReport'?renderResponse(false):rawTabRender(id,...args);tabs.__canonicalReportsV3=true;return true",
                      "if(tabs.__canonicalReportsV4)return true;tabs.render=(id,...args)=>id==='performanceReport'?renderPerformance(false):id==='responseReport'?renderResponse(false):rawTabRender(id,...args);tabs.__canonicalReportsV4=true;tabs.__canonicalReportsV3=true;return true",1)

          click_marker=" document.addEventListener('click',e=>{\n  const refresh=e.target.closest?.('[data-canonical-refresh]');"
          assert click_marker in s
          s=s.replace(click_marker," document.addEventListener('click',e=>{\n  const home=e.target.closest?.('#performanceReportView [data-performance-home]');if(home){e.preventDefault();e.stopImmediatePropagation();window.bamcoShowHome?.();return}\n  const refresh=e.target.closest?.('[data-canonical-refresh]');",1)

          p.write_text(s)

          index=Path('index.html')
          h=index.read_text()
          h=h.replace('<script defer src="assets/js/report-root-fixes-20260911.js?v=20260911-3"></script>\n','')
          h=h.replace('assets/js/report-stability-fixes-20260911.js?v=20260911-4','assets/js/report-stability-fixes-20260911.js?v=performance-root-20260912-1')
          index.write_text(h)
          PY
      - name: Verify root ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -q '__bamcoCanonicalReportsLiveSyncV4' assets/js/report-stability-fixes-20260911.js
          grep -q 'خروجی اکسل فیلترشده' assets/js/report-stability-fixes-20260911.js
          grep -q 'performance-progress' assets/js/report-stability-fixes-20260911.js
          grep -q "const headers=\['متولی'" assets/js/report-stability-fixes-20260911.js
          ! grep -q 'report-root-fixes-20260911.js' index.html
          grep -q 'report-stability-fixes-20260911.js?v=performance-root-20260912-1' index.html
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/report-stability-fixes-20260911.js index.html
          git commit -m 'Rebuild performance report as single canonical runtime'
          git push
