name: Fix canonical Kanban filter count
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-task-filter-count.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch late task filter override
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          app=Path('assets/js/app.js')
          s=app.read_text()
          old='const filters=tableFilters[scope],count=archived?15:14;'
          new='const filters=tableFilters[scope],count=archived?15:13;'
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one stale 15:14 filter override, got {n}')
          app.write_text(s.replace(old,new,1))

          index=Path('index.html')
          h=index.read_text()
          oldq='assets/js/app.js?v=task-filter-repair-20260912-1'
          newq='assets/js/app.js?v=task-filter-repair-20260912-2'
          if oldq not in h:
              raise SystemExit('expected app cache key missing')
          index.write_text(h.replace(oldq,newq,1))
          PY
      - name: Verify canonical task filter counts
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'count=archived?15:13' assets/js/app.js | wc -l)" -eq 2
          ! grep -q 'count=archived?15:14' assets/js/app.js
          grep -q 'app.js?v=task-filter-repair-20260912-2' index.html
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/app.js index.html
          git commit -m 'Restore exact Kanban and archive filter columns'
          git push
