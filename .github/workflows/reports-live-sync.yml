name: Reports and live sync regression

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/report-stability-fixes-20260911.js'
      - 'assets/js/final-production-fixes-20260911.js'
      - 'tests/browser/check_reports_live_sync.py'
      - '.github/workflows/reports-live-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Click reports and exercise live sync
        run: python tests/browser/check_reports_live_sync.py
