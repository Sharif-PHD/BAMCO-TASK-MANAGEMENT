name: One-shot BAMCO size recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bamco-recover-size.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Restore validated lightweight index
        run: |
          git checkout 53238edfb3aebd01d42695300f179596043b000b -- index.html
          test "$(wc -c < index.html)" -eq 1793492
          test -f .nojekyll
          test ! -s .nojekyll
          git diff --check
      - name: Commit recovery and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/bamco-recover-size.yml
          git add index.html
          git commit -m "fix: restore validated lightweight self-contained app"
          git push
