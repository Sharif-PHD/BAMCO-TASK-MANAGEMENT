name: BAMCO CSS canonicalize
on:
  push:
    branches: ['refactor/css-canonical']
    paths: ['.github/workflows/css-canonicalize.yml']
permissions:
  contents: write
jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonicalize only semantically redundant CSS
        run: |
          cp assets/css/app.css /tmp/original.css
          npm install --no-save --no-package-lock postcss@8.5.6 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs');
          const postcss=require('postcss');
          const p='assets/css/app.css';
          const input=fs.readFileSync(p,'utf8');
          const root=postcss.parse(input,{from:p});
          const metrics={rulesBefore:0,rulesAfter:0,repeatedSelectorGroupsBefore:0,repeatedSelectorGroupsAfter:0,exactRulesRemoved:0,adjacentSelectorMerges:0,duplicateDeclsRemoved:0};
          function count(container, key){
            const map=new Map();
            for(const n of container.nodes||[]){
              if(n.type==='rule'){
                metrics[key]++;
                map.set(n.selector,(map.get(n.selector)||0)+1);
              }
              if(n.nodes) count(n,key);
            }
            const rep=[...map.values()].filter(v=>v>1).length;
            if(key==='rulesBefore')metrics.repeatedSelectorGroupsBefore+=rep;
            else metrics.repeatedSelectorGroupsAfter+=rep;
          }
          count(root,'rulesBefore');
          function sigRule(n){
            return n.selector+'\u0000'+(n.nodes||[]).map(x=>x.type==='decl'?'d\u0000'+x.prop+'\u0000'+x.value+'\u0000'+(x.important?'1':'0'):x.toString()).join('\u0001');
          }
          function clean(container){
            if(!container.nodes)return;
            for(const n of [...container.nodes]) if(n.nodes) clean(n);
            // Exact duplicate declarations inside one rule: keep the last identical declaration.
            for(const n of container.nodes){
              if(n.type!=='rule'||!n.nodes)continue;
              const seen=new Set();
              for(let i=n.nodes.length-1;i>=0;i--){
                const d=n.nodes[i];
                if(d.type!=='decl')continue;
                const k=d.prop+'\u0000'+d.value+'\u0000'+(d.important?'1':'0');
                if(seen.has(k)){d.remove();metrics.duplicateDeclsRemoved++;} else seen.add(k);
              }
            }
            // Exact duplicate complete rules in the same cascade context: keep the last one.
            const seenRules=new Set();
            for(let i=container.nodes.length-1;i>=0;i--){
              const n=container.nodes[i];
              if(n.type!=='rule')continue;
              const k=sigRule(n);
              if(seenRules.has(k)){n.remove();metrics.exactRulesRemoved++;} else seenRules.add(k);
            }
            // Merge only immediately adjacent identical selectors. This cannot change precedence.
            let i=0;
            while(i<container.nodes.length-1){
              const a=container.nodes[i];
              let j=i+1;
              while(j<container.nodes.length && container.nodes[j].type==='comment') j++;
              if(a&&a.type==='rule'&&j<container.nodes.length){
                const b=container.nodes[j];
                if(b.type==='rule'&&a.selector===b.selector){
                  for(const child of [...b.nodes]) a.append(child.clone());
                  b.remove();
                  metrics.adjacentSelectorMerges++;
                  continue;
                }
              }
              i++;
            }
            for(const n of [...container.nodes]) if(n.type==='rule' && (!n.nodes||n.nodes.length===0)) n.remove();
          }
          clean(root);
          count(root,'rulesAfter');
          let out=root.toString();
          out=out.split('\n').map(l=>l.replace(/[ \t]+$/,'')).join('\n').trim()+'\n';
          fs.writeFileSync(p,out);
          const report={...metrics,bytesBefore:Buffer.byteLength(input),bytesAfter:Buffer.byteLength(out),bytesSaved:Buffer.byteLength(input)-Buffer.byteLength(out)};
          console.log(JSON.stringify(report,null,2));
          fs.writeFileSync('/tmp/css-report.json',JSON.stringify(report));
          if(report.bytesAfter>report.bytesBefore) throw new Error('CSS grew unexpectedly');
          NODE
          git diff --check
      - name: Exact computed-style regression check
        run: |
          cp /tmp/original.css original.css
          python3 <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text()
          probe=r'''<script>addEventListener('load',()=>setTimeout(()=>{let h=2166136261>>>0,c=0;const add=s=>{for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}};for(const el of document.querySelectorAll('*')){c++;for(const ps of [null,'::before','::after']){const cs=getComputedStyle(el,ps);for(const p of cs){add(p);add(':');add(cs.getPropertyValue(p));add(';')}}}document.documentElement.setAttribute('data-style-hash',h.toString(16));document.documentElement.setAttribute('data-style-count',String(c))},2500))</script>'''
          Path('candidate-test.html').write_text(src.replace('</body>',probe+'</body>'))
          Path('original-test.html').write_text(src.replace('assets/css/app.css','original.css').replace('</body>',probe+'</body>'))
          PY
          python3 -m http.server 8765 >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT; sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for SIZE in 1440,1000 1024,768 580,900; do
            O="$($CHROME --headless --no-sandbox --disable-gpu --window-size=$SIZE --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/original-test.html 2>/dev/null | grep -o 'data-style-hash="[^"]*" data-style-count="[^"]*"' | head -1)"
            C="$($CHROME --headless --no-sandbox --disable-gpu --window-size=$SIZE --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/candidate-test.html 2>/dev/null | grep -o 'data-style-hash="[^"]*" data-style-count="[^"]*"' | head -1)"
            echo "$SIZE original=$O candidate=$C"
            test -n "$O" && test "$O" = "$C"
          done
          rm original.css original-test.html candidate-test.html
          echo computed_style_regression=OK
      - name: Commit canonical CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/app.css
          if git diff --cached --quiet; then echo 'No safe redundant CSS found'; else git commit -m "refactor: remove cascade-safe redundant CSS"; git push origin HEAD:refactor/css-canonical; fi
