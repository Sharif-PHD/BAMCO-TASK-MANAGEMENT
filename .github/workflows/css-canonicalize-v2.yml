name: BAMCO CSS canonicalize v2
on:
  push:
    branches: ['refactor/css-canonical']
    paths: ['.github/workflows/css-canonicalize-v2.yml']
permissions:
  contents: write
jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonicalize cascade-safe CSS
        run: |
          cp assets/css/app.css /tmp/original.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/app.css')
          s=p.read_text()
          if '<NumberFormat/>' not in s:
              raise SystemExit('Expected invalid NumberFormat tail not found')
          p.write_text(s.replace('<NumberFormat/>',''))
          PY
          npm install --no-save --no-package-lock postcss@8.5.6 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'),postcss=require('postcss'),p='assets/css/app.css';
          const input=fs.readFileSync(p,'utf8'),root=postcss.parse(input,{from:p});
          const m={rulesBefore:0,rulesAfter:0,repeatedSelectorGroupsBefore:0,repeatedSelectorGroupsAfter:0,exactRulesRemoved:0,adjacentSelectorMerges:0,duplicateDeclsRemoved:0};
          function count(c,k){const map=new Map();for(const n of c.nodes||[]){if(n.type==='rule'){m[k]++;map.set(n.selector,(map.get(n.selector)||0)+1)}if(n.nodes)count(n,k)}const r=[...map.values()].filter(v=>v>1).length;if(k==='rulesBefore')m.repeatedSelectorGroupsBefore+=r;else m.repeatedSelectorGroupsAfter+=r}
          count(root,'rulesBefore');
          const sig=n=>n.selector+'\0'+(n.nodes||[]).map(x=>x.type==='decl'?'d\0'+x.prop+'\0'+x.value+'\0'+(x.important?'1':'0'):x.toString()).join('\1');
          function clean(c){if(!c.nodes)return;for(const n of [...c.nodes])if(n.nodes)clean(n);for(const n of c.nodes){if(n.type!=='rule'||!n.nodes)continue;const seen=new Set();for(let i=n.nodes.length-1;i>=0;i--){const d=n.nodes[i];if(d.type!=='decl')continue;const k=d.prop+'\0'+d.value+'\0'+(d.important?'1':'0');if(seen.has(k)){d.remove();m.duplicateDeclsRemoved++}else seen.add(k)}}const seenRules=new Set();for(let i=c.nodes.length-1;i>=0;i--){const n=c.nodes[i];if(n.type!=='rule')continue;const k=sig(n);if(seenRules.has(k)){n.remove();m.exactRulesRemoved++}else seenRules.add(k)}let i=0;while(i<c.nodes.length-1){const a=c.nodes[i];let j=i+1;while(j<c.nodes.length&&c.nodes[j].type==='comment')j++;if(a?.type==='rule'&&j<c.nodes.length){const b=c.nodes[j];if(b.type==='rule'&&a.selector===b.selector){for(const child of [...b.nodes])a.append(child.clone());b.remove();m.adjacentSelectorMerges++;continue}}i++}for(const n of [...c.nodes])if(n.type==='rule'&&(!n.nodes||!n.nodes.length))n.remove()}
          clean(root);count(root,'rulesAfter');let out=root.toString().split('\n').map(l=>l.replace(/[ \t]+$/,'')).join('\n').trim()+'\n';fs.writeFileSync(p,out);const report={...m,bytesBefore:Buffer.byteLength(input)+15,bytesAfter:Buffer.byteLength(out),bytesSaved:Buffer.byteLength(input)+15-Buffer.byteLength(out)};console.log('CSS_REPORT='+JSON.stringify(report));if(report.bytesAfter>report.bytesBefore)throw new Error('CSS grew unexpectedly');
          NODE
          git diff --check
      - name: Computed-style regression at desktop tablet mobile
        run: |
          cp /tmp/original.css original.css
          python3 <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text()
          probe=r'''<script>addEventListener('load',()=>setTimeout(()=>{let h=2166136261>>>0,c=0;const add=s=>{for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}};for(const el of document.querySelectorAll('*')){c++;for(const ps of [null,'::before','::after']){const cs=getComputedStyle(el,ps);for(const p of cs){add(p);add(':');add(cs.getPropertyValue(p));add(';')}}}document.documentElement.setAttribute('data-style-hash',h.toString(16));document.documentElement.setAttribute('data-style-count',String(c))},2500))</script>'''
          Path('candidate-test.html').write_text(src.replace('</body>',probe+'</body>'))
          Path('original-test.html').write_text(src.replace('assets/css/app.css','original.css').replace('</body>',probe+'</body>'))
          PY
          python3 -m http.server 8765 >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT; sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for SIZE in 1440,1000 1024,768 580,900; do
            O="$($CHROME --headless --no-sandbox --disable-gpu --window-size=$SIZE --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/original-test.html 2>/dev/null | grep -o 'data-style-hash="[^"]*" data-style-count="[^"]*"' | head -1)"
            C="$($CHROME --headless --no-sandbox --disable-gpu --window-size=$SIZE --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/candidate-test.html 2>/dev/null | grep -o 'data-style-hash="[^"]*" data-style-count="[^"]*"' | head -1)"
            echo "$SIZE original=$O candidate=$C"
            test -n "$O" && test "$O" = "$C"
          done
          rm original.css original-test.html candidate-test.html
          echo computed_style_regression=OK
      - name: Commit canonical CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/app.css
          git commit -m "refactor: canonicalize cascade-safe CSS"
          git push origin HEAD:refactor/css-canonical
