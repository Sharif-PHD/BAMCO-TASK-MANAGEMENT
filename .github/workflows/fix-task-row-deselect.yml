name: Fix task row deselection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-task-row-deselect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch row toggle state and cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          bulk=Path('assets/js/task-bulk-delete-20260912.js')
          s=bulk.read_text()
          old="  lastPicked[scope]=id;decorate(scope,{prune:false});"
          new="  lastPicked[scope]=id;\n  if(typeof state!=='undefined'&&state?.selected)state.selected[scope]=set.size===1?Number([...set][0]):null;\n  decorate(scope,{prune:false});"
          if s.count(old)!=1:
              raise SystemExit(f'toggleRow anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          bulk.write_text(s)

          loader=Path('assets/js/avatar-final-20260911.js')
          a=loader.read_text()
          if 'task-bulk-delete-20260912.js?v=20260912-4' not in a:
              raise SystemExit('bulk loader cache key missing')
          a=a.replace('task-bulk-delete-20260912.js?v=20260912-4','task-bulk-delete-20260912.js?v=20260912-5',1)
          loader.write_text(a)

          index=Path('index.html')
          h=index.read_text()
          pattern=r'assets/js/avatar-final-20260911\.js\?v=[^"\']+'
          matches=re.findall(pattern,h)
          if len(matches)!=1:
              raise SystemExit(f'avatar loader refs={matches}')
          h=re.sub(pattern,'assets/js/avatar-final-20260911.js?v=task-row-deselect-20260912-1',h,count=1)
          index.write_text(h)
          PY
      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "state.selected[scope]=set.size===1?Number([...set][0]):null" assets/js/task-bulk-delete-20260912.js
          grep -Fq 'task-bulk-delete-20260912.js?v=20260912-5' assets/js/avatar-final-20260911.js
          grep -Fq 'assets/js/avatar-final-20260911.js?v=task-row-deselect-20260912-1' index.html
          node --check assets/js/task-bulk-delete-20260912.js
          node --check assets/js/avatar-final-20260911.js
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/task-bulk-delete-20260912.js assets/js/avatar-final-20260911.js index.html
          git commit -m 'Allow selected task rows to toggle off'
          git push
