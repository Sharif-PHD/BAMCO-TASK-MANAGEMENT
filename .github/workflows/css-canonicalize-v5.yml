name: BAMCO CSS canonicalize v5
on:
  push:
    branches: ['refactor/css-canonical']
    paths: ['.github/workflows/css-canonicalize-v5.yml']
permissions:
  contents: write
jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build safe CSS candidate
        run: |
          cp assets/css/app.css /tmp/original.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/app.css'); p.write_text(p.read_text().replace('<NumberFormat/>',''))
          PY
          npm install --no-save --no-package-lock postcss@8.5.6 puppeteer-core@24.16.0 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'),postcss=require('postcss'),p='assets/css/app.css';const raw=fs.readFileSync(p,'utf8'),root=postcss.parse(raw,{from:p});const m={deadMediaRemoved:0,deadMediaBytes:0,adjacentSelectorMerges:0};root.walkAtRules('media',a=>{const q=a.params.replace(/\s+/g,'').toLowerCase();if(q==='(max-width:0px)'||q==='(max-width:0)'){m.deadMediaRemoved++;m.deadMediaBytes+=Buffer.byteLength(a.toString());a.remove()}});function clean(c){if(!c.nodes)return;for(const n of [...c.nodes])if(n.nodes)clean(n);let i=0;while(i<c.nodes.length-1){const a=c.nodes[i],b=c.nodes[i+1];if(a?.type==='rule'&&b?.type==='rule'&&a.selector===b.selector){for(const x of [...b.nodes])a.append(x.clone());b.remove();m.adjacentSelectorMerges++;continue}i++}}clean(root);let out=root.toString().split('\n').map(l=>l.replace(/[ \t]+$/,'')).join('\n').trim()+'\n';fs.writeFileSync(p,out);console.log('CSS_REPORT='+JSON.stringify({...m,bytesBefore:fs.statSync('/tmp/original.css').size,bytesAfter:Buffer.byteLength(out),bytesSaved:fs.statSync('/tmp/original.css').size-Buffer.byteLength(out)}));if(!m.deadMediaRemoved)throw new Error('dead media not found');
          NODE
      - name: Compare standard computed styles in one Chrome
        run: |
          cp /tmp/original.css assets/css/original-test.css
          python3 <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text(); src=re.sub(r'<script\b[^>]*>[\s\S]*?</script>','',src,flags=re.I)
          freeze='<style>*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}</style>'
          Path('candidate-test.html').write_text(src.replace('</head>',freeze+'</head>'))
          Path('original-test.html').write_text(src.replace('assets/css/app.css','assets/css/original-test.css').replace('</head>',freeze+'</head>'))
          PY
          python3 -m http.server 8765 >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT; sleep 1
          node <<'NODE'
          const puppeteer=require('puppeteer-core');const {execSync}=require('child_process');
          const exe=(()=>{for(const c of ['google-chrome','chromium','chromium-browser']){try{return execSync('command -v '+c).toString().trim()}catch{}}throw new Error('Chrome missing')})();
          (async()=>{const browser=await puppeteer.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-gpu']});
          const snap=async(url,w,h)=>{const p=await browser.newPage();await p.setViewport({width:w,height:h});await p.goto(url,{waitUntil:'load'});const r=await p.evaluate(()=>[...document.querySelectorAll('*')].map((el,idx)=>{const take=ps=>{const cs=getComputedStyle(el,ps),o={};for(const k of cs){if(k.startsWith('--')||k.startsWith('animation')||k.startsWith('transition')||k==='caret-color')continue;o[k]=cs.getPropertyValue(k).replace(/\s+/g,' ').trim()}return o};return {idx,tag:el.tagName,id:el.id,cls:el.className,normal:take(null),before:take('::before'),after:take('::after')}}));await p.close();return r};
          for(const [w,h] of [[1440,1000],[1024,768],[580,900],[360,800]]){const a=await snap('http://127.0.0.1:8765/original-test.html',w,h),b=await snap('http://127.0.0.1:8765/candidate-test.html',w,h);if(a.length!==b.length)throw new Error(`element count ${w}: ${a.length}/${b.length}`);let diffs=[];for(let i=0;i<a.length;i++){for(const part of ['normal','before','after']){const keys=new Set([...Object.keys(a[i][part]),...Object.keys(b[i][part])]);for(const k of keys)if(a[i][part][k]!==b[i][part][k]){diffs.push({i,part,k,a:a[i][part][k],b:b[i][part][k],id:a[i].id,tag:a[i].tag});if(diffs.length>=20)break}if(diffs.length>=20)break}if(diffs.length>=20)break}console.log(`VIEWPORT=${w}x${h} DIFFS=${diffs.length}`);if(diffs.length)console.log(JSON.stringify(diffs,null,2));if(diffs.length)throw new Error(`visual computed-style differences at ${w}x${h}`)}await browser.close();console.log('STANDARD_COMPUTED_STYLES=IDENTICAL')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          rm assets/css/original-test.css original-test.html candidate-test.html
      - name: Commit canonical stylesheet
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add assets/css/app.css; git commit -m "refactor: remove dead and redundant CSS safely"; git push origin HEAD:refactor/css-canonical
