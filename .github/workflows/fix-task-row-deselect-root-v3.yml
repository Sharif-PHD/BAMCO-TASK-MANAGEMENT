name: UI cleanup release validation

on:
  push:
    branches:
      - release-ui-toolbar-cleanup-20260912
    paths:
      - .github/workflows/fix-task-row-deselect-root-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply tested UI patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ui-toolbar-cleanup-20260912 main
          git show origin/ui-toolbar-cleanup-20260912:tools/ui-toolbar-cleanup-20260912.py > /tmp/ui-patch.py
          python /tmp/ui-patch.py
          python - <<'PY'
          from pathlib import Path

          def one(path,old,new,label):
              p=Path(path);s=p.read_text();n=s.count(old)
              assert n==1,f'{label}: {n}'
              p.write_text(s.replace(old,new,1))

          one('assets/js/report-stability-fixes-20260911.js',
              "function responseVisible(){const from=inputIso(q('#canonicalResponseFrom')),to=inputIso(q('#canonicalResponseTo'));return responseRows.filter(x=>x.delivery_status!=='cancelled'&&(!from||String(x.sent_at||'').slice(0,10)>=from)&&(!to||String(x.sent_at||'').slice(0,10)<=to)}",
              "function responseVisible(){const from=inputIso(q('#canonicalResponseFrom')),to=inputIso(q('#canonicalResponseTo'));return responseRows.filter(x=>x.delivery_status!=='cancelled'&&(!from||String(x.sent_at||'').slice(0,10)>=from)&&(!to||String(x.sent_at||'').slice(0,10)<=to))}",
              'response filter close')
          one('tests/helpers/app-fixture.cjs',
              'w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;',
              'w.HTMLElement.prototype.scrollTo=function(){};w.scrollTo=()=>{};w.confirm=()=>true;',
              'jsdom window scrollTo stub')
          old="const row=f.d.querySelector('#responseTrackingBody tr[data-delivery=\"11\"]');assert.ok(row);assert.equal(f.d.querySelector('#sendResponseReminder').disabled,true);row.click();await pause(20);assert.equal(row.classList.contains('suite-selected'),true);assert.equal(f.d.querySelector('#sendResponseReminder').disabled,false);"
          new="const row=f.d.querySelector('#responseTrackingBody tr[data-delivery=\"11\"]');assert.ok(row);assert.equal(f.d.querySelector('#responseSelectAll'),null);assert.equal(f.d.querySelector('.response-quick'),null);assert.equal(f.d.querySelector('#sendResponseReminder').disabled,true);row.click();await pause(20);const selectedRow=f.d.querySelector('#responseTrackingBody tr[data-delivery=\"11\"]');assert.equal(selectedRow.classList.contains('suite-selected'),true);assert.equal(f.d.querySelector('#sendResponseReminder').disabled,false);"
          one('tests/workflow-tabs-root-20260912.test.cjs',old,new,'response tracking updated behavior')
          PY

      - name: Check requested source invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          app=Path('assets/js/app.js').read_text()
          resp=Path('assets/js/report-stability-fixes-20260911.js').read_text()
          msg=Path('assets/js/phase2-message-engine.js').read_text()
          sent=Path('assets/js/admin-root-fixes-20260911.js').read_text()
          track=Path('assets/js/phase3-response-tracking.js').read_text()
          assert 'id="applyPerf"' not in idx and "#applyPerf" not in app
          assert 'canonicalResponseSearch' not in resp
          assert '#responseReportView .response-command-row button{font-weight:400!important}' in resp
          assert 'id="messageCenterSearch"' not in msg and 'message-center-simple-toolbar' not in msg
          assert '<button type="button" class="ghost" id="refreshMessageCenter">تازه‌سازی</button><label class="message-channel-inline">کانال ارسال' in msg
          assert '#messageCenterView .message-command-row button{font-weight:400!important}' in msg
          assert 'class="sent-controls"' not in sent and 'id="sentSearch"' not in sent
          assert '#sentMessagesView .sent-command-row button{font-weight:400!important}' in sent
          assert 'id="responseSelectAll"' not in track and 'data-response-quick=' not in track
          assert '#responseTrackingView .response-command-row button{font-weight:400!important}' in track
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check assets/js/app.js
          node --check assets/js/phase2-message-engine.js
          node --check assets/js/phase3-response-tracking.js
          node --check assets/js/tab-workspace.js
          node --check assets/js/admin-root-fixes-20260911.js
          node --check assets/js/report-stability-fixes-20260911.js

      - name: Check patch whitespace
        run: git diff --check

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run workflow regression tests
        run: node --test tests/workflow-tabs-root-20260912.test.cjs

      - name: Run all-tab responsiveness test
        run: node --test tests/all-tab-responsiveness.test.cjs

      - name: Commit tested release payload
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/fix-task-row-deselect-root-v3.yml > .github/workflows/fix-task-row-deselect-root-v3.yml
          git config user.name 'BAMCO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/js/app.js assets/js/phase2-message-engine.js assets/js/phase3-response-tracking.js assets/js/tab-workspace.js assets/js/admin-root-fixes-20260911.js assets/js/report-stability-fixes-20260911.js tests/helpers/app-fixture.cjs tests/workflow-tabs-root-20260912.test.cjs .github/workflows/fix-task-row-deselect-root-v3.yml
          git commit -m 'Clean up dashboard and messaging toolbars'
          git push origin HEAD:release-ui-toolbar-cleanup-20260912
