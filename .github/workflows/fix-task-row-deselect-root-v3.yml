name: Approval workflow root fix validation

on:
  push:
    branches: [approval-workflow-root-fix-20260912]
    paths:
      - '.github/workflows/fix-task-row-deselect-root-v3.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply frontend patch
        run: python .github/scripts/approval_workflow_frontend_patch.py

      - name: Syntax checks
        run: |
          node --check assets/js/app.js
          node --check assets/js/request-sync.js

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare browser fixture
        run: python -c "from pathlib import Path; p=Path('tests/helpers/app-fixture.cjs'); s=p.read_text(); m='  w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;'; p.write_text(s.replace(m,'  w.scrollTo=function(){};w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;',1) if m in s else s)"

      - name: Run request workflow UI regression
        run: node --test .github/scripts/approval_workflow_frontend_test.cjs tests/workflow-tabs-root-20260912.test.cjs

      - name: Restore test-only files and verify final tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- tests/helpers/app-fixture.cjs
          git checkout origin/main -- .github/workflows/fix-task-row-deselect-root-v3.yml
          rm .github/scripts/approval_workflow_frontend_patch.py
          rm .github/scripts/approval_workflow_frontend_test.cjs
          grep -q "request_workflow_snapshot" assets/js/app.js
          grep -q "window.bamcoLoadRequestWorkflow" assets/js/request-sync.js
          grep -q "approval-workflow-root-20260912-1" index.html
          changed="$(git diff --name-only origin/main | sort)"
          expected="$(printf '%s\n' assets/js/app.js assets/js/request-sync.js index.html supabase/migrations/20260912115000_request_workflow_authority_and_snapshot.sql | sort)"
          test "$changed" = "$expected"

      - name: Commit validated frontend and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Sync approval queue and request history atomically'
          git push origin HEAD:approval-workflow-root-fix-20260912
