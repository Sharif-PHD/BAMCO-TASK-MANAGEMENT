name: Approval workflow root fix validation

on:
  push:
    branches: [approval-workflow-root-fix-20260912]
    paths:
      - '.github/workflows/fix-task-row-deselect-root-v3.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch frontend to authoritative workflow snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def exact(path, old, new, label):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise RuntimeError(f'{label}: expected 1 match, got {n}')
              p.write_text(s.replace(old,new,1))

          def rex(path, pattern, new, label):
              p=Path(path); s=p.read_text(); out,n=re.subn(pattern,new,s,count=1,flags=re.S)
              if n != 1: raise RuntimeError(f'{label}: expected 1 match, got {n}')
              p.write_text(out)

          app='assets/js/app.js'
          exact(app,
              "const isManager=()=>state.profile?.role==='manager';\nfunction toast(message,error=false){return window.bamcoNotice(message,{error})}",
              """const isManager=()=>state.profile?.role==='manager';
window.bamcoLoadRequestWorkflow=async function(){
  try{
    const snapshot=await rpc('request_workflow_snapshot',{});
    if(!snapshot||typeof snapshot!=='object'||Array.isArray(snapshot)||!Array.isArray(snapshot.current_requests)||!Array.isArray(snapshot.history_requests)||!Array.isArray(snapshot.routes))throw new Error('workflow snapshot unavailable');
    return{requests:snapshot.current_requests,history:snapshot.history_requests,routes:snapshot.routes};
  }catch(error){
    const actor=state.user?.id,manager=isManager();
    const requestFilter=manager?'select=*&request_status=in.(pending,in_review,needs_revision)&order=created_at.asc':`select=*&requested_by=eq.${actor}&request_status=in.(pending,in_review,needs_revision)&order=created_at.asc`;
    const historyFilter=manager?'select=*&request_status=in.(approved,rejected,cancelled)&order=created_at.desc':`select=*&requested_by=eq.${actor}&request_status=in.(approved,rejected,cancelled)&order=created_at.desc`;
    const [all,routes,history]=await Promise.all([selectAll('change_requests',requestFilter),rpc('request_routing_status',{}).catch(()=>[]),selectAll('change_requests',historyFilter)]);
    const routeById=new Map((routes||[]).map(x=>[String(x.request_id),x]));
    return{requests:manager?all.filter(r=>routeById.get(String(r.id))?.actionable):all,history,routes:routes||[]};
  }
};
function toast(message,error=false){return window.bamcoNotice(message,{error})}""",
              'workflow loader')

          rex(app,
              r"    state\.requests=await select\('change_requests'.*?    state\.requestRoutes=await rpc\('request_routing_status',\{\}\)\.catch\(\(\)=>\[\]\);\n    renderAll\(\);",
              """    const workflow=await window.bamcoLoadRequestWorkflow();
    state.requests=workflow.requests;state.requestHistory=workflow.history;state.requestRoutes=workflow.routes;
    renderAll();""",
              'refresh workflow snapshot')

          sync='assets/js/request-sync.js'
          rex(sync,
              r"   const requestFilter=isManager\(\)\?.*?   const \[requests,routes,history\]=await Promise\.all\(\[\n    selectAll\('change_requests',requestFilter\),\n    rpc\('request_routing_status',\{\}\)\.catch\(\(\)=>state\.requestRoutes\|\|\[\]\),\n    selectAll\('change_requests',historyFilter\)\n   \]\);",
              """   const workflow=await window.bamcoLoadRequestWorkflow();
   const requests=workflow.requests,routes=workflow.routes,history=workflow.history;""",
              'request sync single snapshot')

          index='index.html'
          exact(index,'assets/js/app.js?v=ui-toolbar-cleanup-20260912-1','assets/js/app.js?v=approval-workflow-root-20260912-1','app cache')
          exact(index,'assets/js/request-sync.js?v=approval-sync-20260910-1','assets/js/request-sync.js?v=approval-workflow-root-20260912-1','sync cache')
          PY

      - name: Syntax checks
        run: |
          node --check assets/js/app.js
          node --check assets/js/request-sync.js

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run request workflow UI regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/helpers/app-fixture.cjs');s=p.read_text();marker="  w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;"
          if marker in s:s=s.replace(marker,"  w.scrollTo=function(){};w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;",1)
          p.write_text(s)
          PY
          cat > tests/request-workflow-snapshot-temp.test.cjs <<'JS'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const {fixture,until}=require('./helpers/app-fixture.cjs');

          test('manager current queue and history render from one authoritative workflow snapshot',async t=>{
            const now=new Date().toISOString();
            const snapshot={
              current_requests:[{id:501,request_type:'create',request_status:'in_review',current_stage:2,requested_by:'test-owner',task_id:null,created_at:now,proposed_data:{title:'درخواست جاری تست',priority:'متوسط'}}],
              history_requests:[{id:500,request_type:'create',request_status:'approved',current_stage:2,requested_by:'test-owner',task_id:null,created_at:now,reviewed_at:now,manager_note:'تأیید شد',proposed_data:{title:'درخواست سابقه تست'}}],
              routes:[{request_id:501,stage_no:2,stage_title:'تأیید مدیریت',approver_names:'مدیر آزمایشی',actionable:true}]
            };
            const f=await fixture({fetchResult:({endpoint})=>endpoint==='request_workflow_snapshot'?snapshot:undefined});t.after(()=>f.dispose());
            await f.open('approvals');await until(()=>f.d.querySelector('[data-review-request="501"]'));
            assert.match(f.d.querySelector('#approvalBody').textContent,/درخواست جاری تست/);
            assert.ok(f.d.querySelector('[data-review-request="501"]'));
            f.d.querySelector('[data-review-request="501"]').click();
            assert.equal(f.d.querySelector('#reviewDialog').open,true);
            f.d.querySelector('#reviewDialog').close();
            await f.open('requestHistory');await until(()=>f.d.querySelector('#requestHistoryBody tr[data-request-id="500"]'));
            assert.ok(f.d.querySelector('#requestHistoryBody tr[data-request-id="500"]'));
            assert.equal(f.d.querySelector('#requestHistoryBody tr[data-request-id="501"]'),null);
            assert.match(f.d.querySelector('#requestHistoryBody').textContent,/درخواست سابقه تست/);
          });
          JS
          node --test tests/request-workflow-snapshot-temp.test.cjs tests/workflow-tabs-root-20260912.test.cjs
          rm tests/request-workflow-snapshot-temp.test.cjs
          git checkout -- tests/helpers/app-fixture.cjs

      - name: Verify source invariants and intended diff
        shell: bash
        run: |
          set -euo pipefail
          grep -q "request_workflow_snapshot" assets/js/app.js
          grep -q "window.bamcoLoadRequestWorkflow" assets/js/request-sync.js
          grep -q "approval-workflow-root-20260912-1" index.html
          git checkout origin/main -- .github/workflows/fix-task-row-deselect-root-v3.yml
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD']).decode().split())
          working=set(subprocess.check_output(['git','diff','--name-only']).decode().split())
          intended={'supabase/migrations/20260912115000_request_workflow_authority_and_snapshot.sql'}
          assert changed==intended,(changed,intended)
          allowed={'assets/js/app.js','assets/js/request-sync.js','index.html'}
          assert working==allowed,(working,allowed)
          PY

      - name: Commit validated frontend changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/app.js assets/js/request-sync.js index.html
          git commit -m 'Sync approval queue and request history atomically'
          git push origin HEAD:approval-workflow-root-fix-20260912
