name: UI toolbar cleanup validation v4

on:
  push:
    branches: [ui-toolbar-cleanup-20260912]
    paths:
      - '.github/workflows/fix-task-row-deselect-root-v3.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply source patch and test-harness fixes
        shell: bash
        run: |
          set -o pipefail
          python tools/ui-toolbar-cleanup-20260912.py 2>&1 | tee /tmp/ui-patch.log
          python - <<'PY'
          from pathlib import Path

          def one(path,old,new,label):
              p=Path(path);s=p.read_text();n=s.count(old)
              assert n==1,f'{label}: {n}'
              p.write_text(s.replace(old,new,1))

          one('assets/js/report-stability-fixes-20260911.js',
              "function responseVisible(){const from=inputIso(q('#canonicalResponseFrom')),to=inputIso(q('#canonicalResponseTo'));return responseRows.filter(x=>x.delivery_status!=='cancelled'&&(!from||String(x.sent_at||'').slice(0,10)>=from)&&(!to||String(x.sent_at||'').slice(0,10)<=to)}",
              "function responseVisible(){const from=inputIso(q('#canonicalResponseFrom')),to=inputIso(q('#canonicalResponseTo'));return responseRows.filter(x=>x.delivery_status!=='cancelled'&&(!from||String(x.sent_at||'').slice(0,10)>=from)&&(!to||String(x.sent_at||'').slice(0,10)<=to))}",
              'response filter close')
          one('tests/helpers/app-fixture.cjs',
              'w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;',
              'w.HTMLElement.prototype.scrollTo=function(){};w.scrollTo=()=>{};w.confirm=()=>true;',
              'jsdom window scrollTo stub')
          old="const row=f.d.querySelector('#responseTrackingBody tr[data-delivery=\"11\"]');assert.ok(row);assert.equal(f.d.querySelector('#sendResponseReminder').disabled,true);row.click();await pause(20);assert.equal(row.classList.contains('suite-selected'),true);assert.equal(f.d.querySelector('#sendResponseReminder').disabled,false);"
          new="const row=f.d.querySelector('#responseTrackingBody tr[data-delivery=\"11\"]');assert.ok(row);assert.equal(f.d.querySelector('#responseSelectAll'),null);assert.equal(f.d.querySelector('.response-quick'),null);assert.equal(f.d.querySelector('#sendResponseReminder').disabled,true);row.click();await pause(20);const selectedRow=f.d.querySelector('#responseTrackingBody tr[data-delivery=\"11\"]');assert.equal(selectedRow.classList.contains('suite-selected'),true);assert.equal(f.d.querySelector('#sendResponseReminder').disabled,false);"
          one('tests/workflow-tabs-root-20260912.test.cjs',old,new,'response tracking updated behavior')
          PY

      - name: Syntax checks
        shell: bash
        run: |
          set -o pipefail
          {
            node --check assets/js/app.js
            node --check assets/js/phase2-message-engine.js
            node --check assets/js/phase3-response-tracking.js
            node --check assets/js/admin-root-fixes-20260911.js
            node --check assets/js/report-stability-fixes-20260911.js
            node --check assets/js/tab-workspace.js
          } 2>&1 | tee /tmp/ui-syntax.log

      - name: Install test dependencies
        run: npm ci

      - name: Focused and workflow regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/ui-toolbar-cleanup-20260912.test.cjs tests/workflow-tabs-root-20260912.test.cjs 2>&1 | tee /tmp/ui-targeted.log

      - name: Full regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/ui-full.log

      - name: Commit tested changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/fix-task-row-deselect-root-v3.yml
          git rm -f tools/ui-toolbar-cleanup-20260912.py .github/workflows/ui-toolbar-diagnostic.yml ui-refactor-diagnostics.txt ui-test-failure.txt || true
          git config user.name 'BAMCO UI Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/js/app.js assets/js/phase2-message-engine.js assets/js/phase3-response-tracking.js assets/js/tab-workspace.js assets/js/admin-root-fixes-20260911.js assets/js/report-stability-fixes-20260911.js tests/helpers/app-fixture.cjs tests/workflow-tabs-root-20260912.test.cjs tests/ui-toolbar-cleanup-20260912.test.cjs .github/workflows/fix-task-row-deselect-root-v3.yml
          git commit -m 'Clean dashboard report and messaging controls'
          git push origin HEAD:ui-toolbar-cleanup-20260912

      - name: Preserve failure diagnostics without app changes
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/ui-failure-combined.txt
          : > "$report"
          for f in /tmp/ui-patch.log /tmp/ui-syntax.log /tmp/ui-targeted.log /tmp/ui-full.log; do
            if [ -f "$f" ]; then echo "=== $f ===" >> "$report"; cat "$f" >> "$report"; fi
          done
          git reset --hard HEAD
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/fix-task-row-deselect-root-v3.yml
          cp "$report" ui-test-failure.txt
          git config user.name 'BAMCO UI Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ui-test-failure.txt .github/workflows/fix-task-row-deselect-root-v3.yml
          git commit -m 'Record UI cleanup validation failure' || true
          git push origin HEAD:ui-toolbar-cleanup-20260912
