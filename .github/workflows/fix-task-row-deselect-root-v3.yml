name: Main baseline full regression

on:
  push:
    branches: [ui-toolbar-cleanup-20260912]
    paths:
      - '.github/workflows/fix-task-row-deselect-root-v3.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run identical suite against current main
        shell: bash
        run: |
          set +e
          git fetch origin main
          git worktree add /tmp/bamco-main-baseline origin/main
          cd /tmp/bamco-main-baseline
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/helpers/app-fixture.cjs')
          s=p.read_text()
          old='w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;'
          new='w.HTMLElement.prototype.scrollTo=function(){};w.scrollTo=()=>{};w.confirm=()=>true;'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          npm ci
          npm test > /tmp/main-baseline-full.log 2>&1
          status=$?
          printf '\nBASELINE_EXIT=%s\n' "$status" >> /tmp/main-baseline-full.log
          exit 0
      - name: Save baseline log to feature branch
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/main-baseline-full.log main-baseline-full-regression.txt
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/fix-task-row-deselect-root-v3.yml
          git config user.name 'BAMCO UI Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add main-baseline-full-regression.txt .github/workflows/fix-task-row-deselect-root-v3.yml
          git commit -m 'Record main full-regression baseline'
          git push origin HEAD:ui-toolbar-cleanup-20260912
