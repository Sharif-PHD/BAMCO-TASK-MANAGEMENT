name: Response tracking filter cleanup validation

on:
  push:
    branches: [response-tracking-filter-cleanup-20260912]
    paths:
      - '.github/workflows/fix-task-row-deselect-root-v3.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply root UI cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/phase3-response-tracking.js')
          s=p.read_text()
          reps=[
          ("  const from=iso(q('#responseFrom')?.value),to=iso(q('#responseTo')?.value,true),person=q('#responsePerson')?.value||'',channel=q('#responseChannel')?.value||'',status=q('#responseState')?.value||'';\n  return rows.filter(x=>x.delivery_status!=='cancelled'&&(!from||String(x.sent_at||'')>=from)&&(!to||String(x.sent_at||'')<=to)&&(!person||String(x.recipient_id)===String(person))&&(!channel||x.channel===channel)&&(!status||x.response_status===status));",
           "  const from=iso(q('#responseFrom')?.value),to=iso(q('#responseTo')?.value,true);\n  return rows.filter(x=>x.delivery_status!=='cancelled'&&(!from||String(x.sent_at||'')>=from)&&(!to||String(x.sent_at||'')<=to));"),
          ("    #responseTrackingView #sendResponseReminder{order:5}\n    #responseTrackingView .response-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}\n    #responseTrackingView .response-quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px}",
           "    #responseTrackingView #reminderSendChannel{order:5;height:38px;min-width:132px}\n    #responseTrackingView #sendResponseReminder{order:6}"),
          ("<button type=\"button\" class=\"ghost\" data-response-export>خروجی اکسل</button><button id=\"sendResponseReminder\" type=\"button\" class=\"primary\">ارسال یادآوری</button></div><div class=\"response-filters\"><select id=\"reminderSendChannel\" aria-label=\"کانال یادآوری\"><option value=\"portal\">داخل سامانه</option><option value=\"email\">ایمیل</option><option value=\"both\">هر دو</option></select><select id=\"responsePerson\"><option value=\"\">همه افراد</option></select><select id=\"responseChannel\"><option value=\"\">همه کانال‌ها</option><option value=\"portal\">داخل سامانه</option><option value=\"email\">ایمیل</option></select><select id=\"responseState\"><option value=\"\">همه وضعیت‌ها</option><option value=\"replied\">پاسخ داده</option><option value=\"awaiting\">بدون پاسخ</option><option value=\"failed\">خطای ارسال</option><option value=\"reminder_needed\">نیازمند یادآوری</option></select></div><div class=\"table-wrap\">",
           "<button type=\"button\" class=\"ghost\" data-response-export>خروجی اکسل</button><select id=\"reminderSendChannel\" aria-label=\"کانال یادآوری\"><option value=\"portal\">داخل سامانه</option><option value=\"email\">ایمیل</option><option value=\"both\">هر دو</option></select><button id=\"sendResponseReminder\" type=\"button\" class=\"primary\">ارسال یادآوری</button></div><div class=\"table-wrap\">"),
          ("  qa('#responseFrom,#responseTo,#responsePerson,#responseChannel,#responseState').forEach(x=>x.addEventListener(x.tagName==='SELECT'?'change':'input',()=>{selected.clear();render()}));",
           "  qa('#responseFrom,#responseTo').forEach(x=>x.addEventListener('input',()=>{selected.clear();render()}));"),
          ("    const people=[...new Map(rows.filter(x=>x.recipient_id).map(x=>[String(x.recipient_id),x])).values()];\n    const select=q('#responsePerson'),current=select?.value||'';if(select){select.innerHTML='<option value=\"\">همه افراد</option>'+people.map(x=>`<option value=\"${esc(x.recipient_id)}\">${esc(x.recipient_name||x.recipient_email||'—')}</option>`).join('');select.value=current}\n    render();",
           "    render();")
          ]
          for old,new in reps:
            if s.count(old)!=1: raise SystemExit(f'expected one match, got {s.count(old)} for {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          idx=Path('index.html')
          h=idx.read_text()
          old='assets/js/phase3-response-tracking.js?v=ui-toolbar-cleanup-20260912-1'
          new='assets/js/phase3-response-tracking.js?v=response-filter-cleanup-20260912-2'
          if h.count(old)!=1: raise SystemExit(f'cache marker count={h.count(old)}')
          idx.write_text(h.replace(old,new,1))
          PY
      - name: Syntax check
        run: node --check assets/js/phase3-response-tracking.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run focused UI acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/helpers/app-fixture.cjs')
          s=p.read_text(); marker="  w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;"
          if marker in s: s=s.replace(marker,"  w.scrollTo=function(){};w.HTMLElement.prototype.scrollTo=function(){};w.confirm=()=>true;",1)
          p.write_text(s)
          PY
          cat > tests/response-filter-cleanup-temp.test.cjs <<'JS'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const {fixture,until,pause}=require('./helpers/app-fixture.cjs');
          test('response tracking removes duplicate external filters and keeps reminder channel in command row',async t=>{
            const f=await fixture({tables:{message_response_tracking:[{delivery_id:77,recipient_id:'test-owner',recipient_name:'متولی آزمایشی',channel:'portal',subject:'پیام آزمایشی',sent_at:new Date().toISOString(),delivery_status:'sent',response_status:'awaiting',reminder_count:0}]}});t.after(()=>f.dispose());
            await f.open('responseTracking');await until(()=>f.d.querySelector('#responseTrackingView .response-command-row'));
            const view=f.d.querySelector('#responseTrackingView'),bar=view.querySelector('.response-command-row');
            assert.equal(view.querySelector('.response-filters'),null);
            assert.equal(view.querySelector('#responsePerson'),null);
            assert.equal(view.querySelector('#responseChannel'),null);
            assert.equal(view.querySelector('#responseState'),null);
            const reminderChannel=view.querySelector('#reminderSendChannel');assert.ok(reminderChannel);assert.equal(reminderChannel.parentElement,bar);
            assert.ok(view.querySelector('#sendResponseReminder'));assert.ok(view.querySelector('#responseTrackingBody tr[data-delivery="77"]'));
            const css=f.d.querySelector('#bamcoResponseTrackingRootCss').textContent;assert.doesNotMatch(css,/\.response-filters\{/);
            const src=require('node:fs').readFileSync('assets/js/phase3-response-tracking.js','utf8');assert.doesNotMatch(src,/#responsePerson|#responseChannel|#responseState/);
            assert.equal(f.errors.length,0,f.errors.join('\n'));
          });
          JS
          node --test tests/response-filter-cleanup-temp.test.cjs
          rm tests/response-filter-cleanup-temp.test.cjs
          git checkout -- tests/helpers/app-fixture.cjs
      - name: Verify intended diff only
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/fix-task-row-deselect-root-v3.yml
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().split())
          allowed={'assets/js/phase3-response-tracking.js','index.html'}
          assert changed==allowed,(changed,allowed)
          PY
      - name: Commit validated app changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/phase3-response-tracking.js index.html
          git commit -m 'Remove duplicate response tracking filters'
          git push origin HEAD:response-tracking-filter-cleanup-20260912
