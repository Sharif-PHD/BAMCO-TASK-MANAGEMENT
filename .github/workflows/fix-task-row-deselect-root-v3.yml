name: Clean UI publish commit

on:
  push:
    branches:
      - release-ui-toolbar-cleanup-20260912
    paths:
      - .github/workflows/fix-task-row-deselect-root-v3.yml

permissions:
  contents: write

jobs:
  publish-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build clean patch from tested commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main publish-ui-cleanup-20260912 release-ui-toolbar-cleanup-20260912
          git diff 5c2517e084c74124fbe6c730a65607484681abfe..765d59ce4714a965a73170656e0e3356ba27e257 -- . ':(exclude).github/workflows/fix-task-row-deselect-root-v3.yml' > /tmp/release.patch
          test -s /tmp/release.patch
          git switch -C publish-ui-cleanup-20260912 origin/main
          git apply --check /tmp/release.patch
          git apply /tmp/release.patch
          git diff --check
          python - <<'PY'
          import subprocess
          expected={
            'index.html',
            'assets/js/app.js',
            'assets/js/phase2-message-engine.js',
            'assets/js/phase3-response-tracking.js',
            'assets/js/tab-workspace.js',
            'assets/js/admin-root-fixes-20260911.js',
            'assets/js/report-stability-fixes-20260911.js',
            'tests/helpers/app-fixture.cjs',
            'tests/workflow-tabs-root-20260912.test.cjs',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,(sorted(actual),sorted(expected))
          PY

      - name: Revalidate clean patch
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check assets/js/phase2-message-engine.js
          node --check assets/js/phase3-response-tracking.js
          node --check assets/js/tab-workspace.js
          node --check assets/js/admin-root-fixes-20260911.js
          node --check assets/js/report-stability-fixes-20260911.js
          npm ci --no-audit --no-fund
          node --test tests/workflow-tabs-root-20260912.test.cjs
          node --test tests/all-tab-responsiveness.test.cjs

      - name: Commit clean production payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/js/app.js assets/js/phase2-message-engine.js assets/js/phase3-response-tracking.js assets/js/tab-workspace.js assets/js/admin-root-fixes-20260911.js assets/js/report-stability-fixes-20260911.js tests/helpers/app-fixture.cjs tests/workflow-tabs-root-20260912.test.cjs
          git commit -m 'Clean up dashboard and messaging toolbars'
          git push origin HEAD:publish-ui-cleanup-20260912
