name: Task row deselect visible live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task-row-deselect-visible-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for authoritative deselection build
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 40); do
            html="$(curl -fsSL --connect-timeout 10 "${BASE}?deselect-root=${GITHUB_SHA}-${i}" || true)"
            app="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/app.js?deselect-root=${GITHUB_SHA}-${i}" || true)"
            bulk="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/task-bulk-delete-20260912.js?deselect-root=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'app.js?v=task-row-deselect-root-20260912-3' <<<"$html" \
              && grep -q 'avatar-final-20260911.js?v=task-row-deselect-root-20260912-3' <<<"$html" \
              && grep -q 'const next=String(state.selected\[scope\])===String(id)?null:Number(id)' <<<"$app" \
              && grep -q '__bamcoTaskBulkDelete20260912V6' <<<"$bulk"; then
              ready=1; break
            fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify second click deselects with full runtime active
        shell: bash
        run: |
          cat > /tmp/check_deselect_visible.py <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          def greenish(value):
              m=re.match(r'rgba?\((\d+),\s*(\d+),\s*(\d+)', value or '')
              if not m: return False
              r,g,b=map(int,m.groups())
              return g > r and g > b and g-r >= 15

          async def dispatch_row_click(page, selector):
              ok=await page.evaluate("""selector => {
                const el=document.querySelector(selector); if(!el) return false;
                return el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,composed:true,view:window}));
              }""", selector)
              assert ok is not None

          async def verify_scope(page, scope, task_id):
              await page.evaluate("scope => { document.querySelectorAll('dialog[open]').forEach(d=>{try{d.close()}catch{}}); showView(scope) }", scope)
              await page.wait_for_timeout(100)
              body=f'#{scope}Body'
              row=f'{body} tr[data-task-id="{task_id}"]'
              await dispatch_row_click(page,row+' td:nth-child(2)')
              await page.wait_for_function(f"() => window.bamcoTaskSelection.count('{scope}')===1")
              bg=await page.locator(row+' td').first.evaluate('el=>getComputedStyle(el).backgroundColor')
              assert greenish(bg), (scope,'not green',bg)
              assert await page.locator(row).get_attribute('aria-selected') == 'true'
              await dispatch_row_click(page,row+' td:nth-child(2)')
              await page.wait_for_function(f"() => window.bamcoTaskSelection.count('{scope}')===0 && state.selected.{scope}===null")
              assert await page.locator(row).get_attribute('aria-selected') == 'false'
              assert not await page.locator(row).evaluate("el=>el.classList.contains('task-selected')")
              bg2=await page.locator(row+' td').first.evaluate('el=>getComputedStyle(el).backgroundColor')
              assert not greenish(bg2), (scope,'still green',bg2)
              delete_id='kanbanDeleteBtn' if scope=='kanban' else 'archiveDeleteBtn'
              assert await page.locator('#'+delete_id).is_disabled()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1440,'height':900})
                  errors=[]
                  page.on('pageerror', lambda exc: errors.append(str(exc)))
                  await page.goto(BASE+'?visible-deselect=5', wait_until='networkidle')
                  await page.wait_for_function("typeof renderTasks==='function' && window.__bamcoTaskBulkDelete20260912V6===true")
                  await page.evaluate("""() => {
                    state.profile={id:'00000000-0000-0000-0000-000000000001',role:'manager',active:true,full_name:'مدیر'};
                    state.profiles=[state.profile];
                    state.tasks=[
                      {id:99101,legacy_id:1,title:'ردیف کانبان',description:'الف',owner_id:state.profile.id,status:'ثبت شده',priority:'متوسط',start_date:null,done_date:null,due_date:null,reminder_days:0,last_updated_at:null,due_state:'',manager_notes:'',archived:false},
                      {id:99102,legacy_id:2,title:'ردیف آرشیو',description:'ب',owner_id:state.profile.id,status:'انجام شده',priority:'متوسط',start_date:null,done_date:null,due_date:null,reminder_days:0,last_updated_at:null,due_state:'',manager_notes:'',archived:true,delay_days:1,advance_days:0}
                    ];
                    state.selected={kanban:null,archive:null};
                    renderTasks(false);renderTasks(true);
                    document.body.classList.remove('department-pending');
                    document.querySelector('#departmentEntry')?.setAttribute('hidden','');
                    document.querySelector('#loginView')?.classList.add('hidden');
                    document.querySelector('#appView').classList.remove('hidden');
                    showView('kanban');
                  }""")
                  await page.wait_for_timeout(900)
                  await page.evaluate("() => {document.querySelectorAll('dialog[open]').forEach(d=>{try{d.close()}catch{}});renderTasks(false);renderTasks(true);showView('kanban')}")
                  await page.wait_for_timeout(150)
                  await verify_scope(page,'kanban',99101)
                  await verify_scope(page,'archive',99102)
                  assert not errors, errors
                  print(json.dumps({'kanban':'select+deselect','archive':'select+deselect','full_runtime_event_propagation':True,'status':'passed'},ensure_ascii=False))
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/check_deselect_visible.py
