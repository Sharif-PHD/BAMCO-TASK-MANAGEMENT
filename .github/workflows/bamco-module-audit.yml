name: BAMCO module audit
on:
  push:
    paths:
      - '.github/workflows/bamco-module-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current index structure
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const styles=[...html.matchAll(/<style([^>]*)>([\s\S]*?)<\/style>/gi)];
          const scripts=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)];
          console.log('INDEX_BYTES='+Buffer.byteLength(html));
          console.log('STYLE_BLOCKS='+styles.length);
          styles.forEach((m,i)=>{
            const body=m[2], comments=[...body.matchAll(/\/\*([\s\S]*?)\*\//g)].map(x=>x[1].trim().replace(/\s+/g,' ')).filter(Boolean);
            console.log(`STYLE_${i+1}_BYTES=${Buffer.byteLength(body)} COMMENTS=${JSON.stringify(comments.slice(0,80))}`);
          });
          console.log('SCRIPT_BLOCKS='+scripts.length);
          scripts.forEach((m,i)=>{
            const attrs=m[1].trim(); const body=m[2];
            const comments=[...body.matchAll(/\/\*([\s\S]*?)\*\//g)].map(x=>x[1].trim().replace(/\s+/g,' ')).filter(Boolean);
            const head=body.trim().split(/\n/).slice(0,3).join(' ').slice(0,180);
            console.log(`SCRIPT_${i+1}_BYTES=${Buffer.byteLength(body)} ATTRS=${JSON.stringify(attrs)} COMMENTS=${JSON.stringify(comments.slice(0,20))} HEAD=${JSON.stringify(head)}`);
          });
          NODE
      - name: Remove audit workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/bamco-module-audit.yml
          git commit -m "chore: remove one-shot module audit" || true
          git push
