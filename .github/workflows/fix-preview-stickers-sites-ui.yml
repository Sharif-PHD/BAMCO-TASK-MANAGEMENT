name: Fix preview stickers sites UI
on:
  push:
    branches: [fix/document-preview-welcome-stickers-sites-ui-20260912]
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/document-preview-welcome-stickers-sites-ui-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and validate requested fixes
        run: node .github/scripts/fix-preview-stickers-sites-ui.cjs
      - name: Syntax checks
        run: |
          node --check assets/js/documents-sites.js
          node --check assets/js/card-home.js
      - name: Existing feature regression tests
        run: node --test tests/documents-sites.test.cjs
      - name: Verify tracked sticker policy
        run: |
          grep -q "for select" supabase/migrations/20260912_allow_authenticated_welcome_sticker_read.sql
          grep -q "to authenticated" supabase/migrations/20260912_allow_authenticated_welcome_sticker_read.sql
          grep -q "private.has_account()" supabase/migrations/20260912_allow_authenticated_welcome_sticker_read.sql
      - name: Commit validated fixes
        run: |
          git config user.name "BAMCO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix document preview, welcome stickers and sites UI"
          git push origin HEAD:fix/document-preview-welcome-stickers-sites-ui-20260912
