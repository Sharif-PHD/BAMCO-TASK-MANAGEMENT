name: BAMCO CSS canonicalize v4
on:
  push:
    branches: ['refactor/css-canonical']
    paths: ['.github/workflows/css-canonicalize-v4.yml']
permissions:
  contents: write
jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dead legacy CSS and safe duplicates
        run: |
          cp assets/css/app.css /tmp/original.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/app.css'); s=p.read_text(); p.write_text(s.replace('<NumberFormat/>',''))
          PY
          npm install --no-save --no-package-lock postcss@8.5.6 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'),postcss=require('postcss'),p='assets/css/app.css';
          const raw=fs.readFileSync(p,'utf8'),root=postcss.parse(raw,{from:p});
          const m={rulesBefore:0,rulesAfter:0,repeatedSelectorGroupsBefore:0,repeatedSelectorGroupsAfter:0,deadMediaRemoved:0,deadMediaBytes:0,exactRulesRemoved:0,adjacentSelectorMerges:0,duplicateDeclsRemoved:0};
          function count(c,k){const map=new Map();for(const n of c.nodes||[]){if(n.type==='rule'){m[k]++;map.set(n.selector,(map.get(n.selector)||0)+1)}if(n.nodes)count(n,k)}const r=[...map.values()].filter(v=>v>1).length;if(k==='rulesBefore')m.repeatedSelectorGroupsBefore+=r;else m.repeatedSelectorGroupsAfter+=r}
          count(root,'rulesBefore');
          root.walkAtRules('media',a=>{const q=a.params.replace(/\s+/g,'').toLowerCase();if(q==='(max-width:0px)'||q==='(max-width:0)'){m.deadMediaRemoved++;m.deadMediaBytes+=Buffer.byteLength(a.toString());a.remove()}});
          const sig=n=>n.selector+'\0'+(n.nodes||[]).map(x=>x.type==='decl'?'d\0'+x.prop+'\0'+x.value+'\0'+(x.important?'1':'0'):x.toString()).join('\1');
          function clean(c){if(!c.nodes)return;for(const n of [...c.nodes])if(n.nodes)clean(n);for(const n of c.nodes){if(n.type!=='rule'||!n.nodes)continue;const seen=new Set();for(let i=n.nodes.length-1;i>=0;i--){const d=n.nodes[i];if(d.type!=='decl')continue;const k=d.prop+'\0'+d.value+'\0'+(d.important?'1':'0');if(seen.has(k)){d.remove();m.duplicateDeclsRemoved++}else seen.add(k)}}const sr=new Set();for(let i=c.nodes.length-1;i>=0;i--){const n=c.nodes[i];if(n.type!=='rule')continue;const k=sig(n);if(sr.has(k)){n.remove();m.exactRulesRemoved++}else sr.add(k)}let i=0;while(i<c.nodes.length-1){const a=c.nodes[i],b=c.nodes[i+1];if(a?.type==='rule'&&b?.type==='rule'&&a.selector===b.selector){for(const x of [...b.nodes])a.append(x.clone());b.remove();m.adjacentSelectorMerges++;continue}i++}for(const n of [...c.nodes])if(n.type==='rule'&&(!n.nodes||!n.nodes.length))n.remove()}
          clean(root);count(root,'rulesAfter');let out=root.toString().split('\n').map(l=>l.replace(/[ \t]+$/,'')).join('\n').trim()+'\n';fs.writeFileSync(p,out);const before=Buffer.byteLength(fs.readFileSync('/tmp/original.css')),after=Buffer.byteLength(out);console.log('CSS_REPORT='+JSON.stringify({...m,bytesBefore:before,bytesAfter:after,bytesSaved:before-after}));if(m.deadMediaRemoved<1||after>=before)throw new Error('Expected safe size reduction');
          NODE
          git diff --check
      - name: Deterministic computed-style regression
        run: |
          cp /tmp/original.css assets/css/original-test.css
          python3 <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text()
          src=re.sub(r'<script\b[^>]*>[\s\S]*?</script>','',src,flags=re.I)
          freeze='<style>*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}</style>'
          probe=r'''<script>addEventListener('load',()=>{let h=2166136261>>>0,c=0;const add=s=>{for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}};for(const el of document.querySelectorAll('*')){c++;for(const ps of [null,'::before','::after']){const cs=getComputedStyle(el,ps);for(const p of cs){if(p.startsWith('animation')||p.startsWith('transition')||p==='caret-color')continue;add(p);add(':');add(cs.getPropertyValue(p));add(';')}}}document.documentElement.dataset.styleHash=h.toString(16);document.documentElement.dataset.styleCount=String(c)})</script>'''
          Path('candidate-test.html').write_text(src.replace('</head>',freeze+'</head>').replace('</body>',probe+'</body>'))
          Path('original-test.html').write_text(src.replace('assets/css/app.css','assets/css/original-test.css').replace('</head>',freeze+'</head>').replace('</body>',probe+'</body>'))
          PY
          python3 -m http.server 8765 >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT; sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for SIZE in 1440,1000 1024,768 580,900 360,800; do
            O="$($CHROME --headless --no-sandbox --disable-gpu --window-size=$SIZE --virtual-time-budget=2000 --dump-dom http://127.0.0.1:8765/original-test.html 2>/dev/null | grep -o 'data-style-hash="[^"]*" data-style-count="[^"]*"' | head -1)"
            C="$($CHROME --headless --no-sandbox --disable-gpu --window-size=$SIZE --virtual-time-budget=2000 --dump-dom http://127.0.0.1:8765/candidate-test.html 2>/dev/null | grep -o 'data-style-hash="[^"]*" data-style-count="[^"]*"' | head -1)"
            echo "$SIZE original=$O candidate=$C"; test -n "$O"; test "$O" = "$C"
          done
          rm assets/css/original-test.css original-test.html candidate-test.html
          echo deterministic_css_regression=OK
      - name: Commit canonical stylesheet
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/app.css; git commit -m "refactor: remove dead and redundant CSS safely"; git push origin HEAD:refactor/css-canonical
