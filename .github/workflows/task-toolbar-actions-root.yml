name: Task toolbar actions root cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task-toolbar-actions-root.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Point index at fresh toolbar runtime loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='assets/js/avatar-final-20260911.js?v=task-row-deselect-root-20260912-3'
          new='assets/js/avatar-final-20260911.js?v=task-toolbar-actions-20260912-1'
          assert old in s, 'expected avatar loader cache key not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q 'task-toolbar-actions-20260912.js?v=20260912-1' assets/js/avatar-final-20260911.js
          grep -q 'avatar-final-20260911.js?v=task-toolbar-actions-20260912-1' index.html
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Force fresh task toolbar action runtime'
          git push
