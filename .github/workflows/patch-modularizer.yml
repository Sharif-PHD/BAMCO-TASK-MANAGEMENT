name: Patch modularizer
on:
  push:
    branches: ['refactor/modular-app']
    paths: ['.github/workflows/patch-modularizer.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make XLSX extraction structural
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/bamco-modularize.yml')
          s=p.read_text()
          old="html=html.replace(styles[0][0],'<link rel=\"stylesheet\" href=\"assets/css/app.css\">').replace(styles[1][0],'');\n          for(const [oldv,newv] of replacements) html=html.replace(oldv,newv);"
          new="html=html.replace(styles[0][0],'<link rel=\"stylesheet\" href=\"assets/css/app.css\">').replace(styles[1][0],'');\n          html=html.replace(/<script\\s+type=[\"']application\\/bamco-xlsx-source[\"'][^>]*>[\\s\\S]*?<\\/script>/i,'');\n          for(const [oldv,newv] of replacements) html=html.replace(oldv,newv);"
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-modularizer.yml
          git add .github/workflows/bamco-modularize.yml
          git commit -m "fix: extract embedded XLSX structurally"
          git push origin HEAD:refactor/modular-app
