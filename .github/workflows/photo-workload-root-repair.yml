name: Profile photo and workload count repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photo-workload-root-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct image cleanup and competing chart renderers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changes = {}
          def replace_once(path, old, new):
              text = changes.get(path, Path(path).read_text(encoding='utf-8'))
              if old in new and new in text:
                  return
              if old not in text and new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected source in {path}: {old!r}; review concurrent edits')
              changes[path] = text.replace(old, new, 1)
          replace_once('assets/js/messaging-history-root-20260911.js',
              "['#departmentEntry header img','#loginView .brand-lockup img','#appView>.card-topbar img']",
              "['#departmentEntry>header>img','#loginView .brand-lockup>img','#appView>.card-topbar>img']")
          replace_once('assets/js/messaging-history-root-20260911.js',
              'function dedupeLogos(){',
              '// Limit cleanup to direct brand images, never nested profile photos.\nfunction dedupeLogos(){')
          replace_once('assets/js/app.js',
              'function workload(canvas,rows){const title=',
              "function workload(canvas,rows){if(typeof window.bamcoDrawWorkload==='function')return window.bamcoDrawWorkload();const title=")
          replace_once('assets/js/dashboard-response-fixes-20260911.js',
              'function drawWorkload(){\n',
              "function drawWorkload(){\n if(typeof window.bamcoDrawWorkload==='function')return window.bamcoDrawWorkload();\n")
          # The current avatar module no longer draws workload charts. Preserve it.
          avatar = Path('assets/js/login-avatar-workload-fix-20260911.js').read_text(encoding='utf-8')
          if 'function drawSimpleWorkload' in avatar:
              raise SystemExit('Unexpected legacy avatar/workload module; reconcile before applying')
          replace_once('assets/js/workload-segment-labels-20260911.js',
              'scale=(bottom-top)/max;',
              'tickStep=Math.max(1,Math.ceil(max/5)),axisMax=Math.ceil(max/tickStep)*tickStep,scale=(bottom-top)/axisMax;')
          replace_once('assets/js/workload-segment-labels-20260911.js',
              'for(let step=0;step<=5;step++){const y=bottom-(bottom-top)*step/5;',
              'for(let value=0;value<=axisMax;value+=tickStep){const y=bottom-value*scale;')
          replace_once('assets/js/workload-segment-labels-20260911.js',
              'faNum(Math.round(max*step/5))', 'faNum(value)')
          replace_once('assets/js/workload-segment-labels-20260911.js',
              'function schedule(){',
              '// Use one renderer for navigation, filters, refresh and delayed resize events.\nwindow.bamcoDrawWorkload=draw;\nfunction schedule(){')
          path = 'index.html'
          text = Path(path).read_text(encoding='utf-8')
          for name in ['app.js','messaging-history-root-20260911.js','dashboard-response-fixes-20260911.js','workload-segment-labels-20260911.js']:
              pattern = r'(assets/js/' + re.escape(name) + r'\?v=)[^"\s>]+'
              text, count = re.subn(pattern, r'\g<1>profile-counts-20260911-1', text)
              if count != 1:
                  raise SystemExit(f'Unexpected asset reference for {name}')
          changes[path] = text
          for path,text in changes.items():
              if '\ufffd' in text:
                  raise SystemExit(f'Invalid UTF-8 replacement character in {path}')
          for path,text in changes.items():
              Path(path).write_text(text,encoding='utf-8')
              print('Updated '+path)
          PY
          for f in assets/js/app.js assets/js/messaging-history-root-20260911.js assets/js/dashboard-response-fixes-20260911.js assets/js/workload-segment-labels-20260911.js; do
            node --check "$f"
          done
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify profile photos and plain counts on desktop and mobile
        run: python tests/browser/check_profile_photo_workload_counts.py
      - name: Preserve the post-welcome viewport fix
        run: python tests/browser/check_post_welcome.py
      - name: Upload isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-photo-workload-regressions
          path: |
            test-results/avatar-workload/
            test-results/post-welcome/
          retention-days: 7
      - name: Commit only verified application corrections
        run: |
          if git diff --quiet -- assets/js index.html; then
            echo 'Source already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/app.js assets/js/messaging-history-root-20260911.js assets/js/dashboard-response-fixes-20260911.js assets/js/workload-segment-labels-20260911.js index.html
          git commit -m 'Preserve profile photos and use consistent plain workload counts'
          git push origin HEAD:main
