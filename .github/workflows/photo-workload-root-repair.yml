name: Profile photo and workload count repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photo-workload-root-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded source corrections without overwriting unrelated edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          changes = {}
          def replace_once(path, old, new):
              text = changes.get(path, Path(path).read_text(encoding='utf-8'))
              if old in new and new in text:
                  return
              if old not in text and new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected source in {path}; review concurrent edits before retrying')
              changes[path] = text.replace(old, new, 1)
          replace_once('assets/js/messaging-history-root-20260911.js',
              "['#departmentEntry header img','#loginView .brand-lockup img','#appView>.card-topbar img']",
              "['#departmentEntry>header>img','#loginView .brand-lockup>img','#appView>.card-topbar>img']")
          replace_once('assets/js/messaging-history-root-20260911.js',
              'function dedupeLogos(){',
              '// Limit cleanup to direct brand images, never nested profile photos.\nfunction dedupeLogos(){')
          replace_once('assets/js/app.js',
              'function workload(canvas,rows){const title=',
              "function workload(canvas,rows){if(typeof window.bamcoDrawWorkload==='function')return window.bamcoDrawWorkload();const title=")
          replace_once('assets/js/dashboard-response-fixes-20260911.js',
              'function drawWorkload(){\n',
              "function drawWorkload(){\n if(typeof window.bamcoDrawWorkload==='function')return window.bamcoDrawWorkload();\n")
          replace_once('assets/js/login-avatar-workload-fix-20260911.js',
              'function drawSimpleWorkload(){\n',
              "function drawSimpleWorkload(){\n  if(typeof window.bamcoDrawWorkload==='function')return window.bamcoDrawWorkload();\n")
          replace_once('assets/js/workload-segment-labels-20260911.js',
              'scale=(bottom-top)/max;',
              'tickStep=Math.max(1,Math.ceil(max/5)),axisMax=Math.ceil(max/tickStep)*tickStep,scale=(bottom-top)/axisMax;')
          replace_once('assets/js/workload-segment-labels-20260911.js',
              'for(let step=0;step<=5;step++){const y=bottom-(bottom-top)*step/5;',
              'for(let value=0;value<=axisMax;value+=tickStep){const y=bottom-value*scale;')
          replace_once('assets/js/workload-segment-labels-20260911.js',
              'faNum(Math.round(max*step/5))', 'faNum(value)')
          replace_once('assets/js/workload-segment-labels-20260911.js',
              'function schedule(){',
              '// Use one renderer for navigation, filters, refresh and delayed resize events.\nwindow.bamcoDrawWorkload=draw;\nfunction schedule(){')
          new_avatar = r'''let avatarObjectUrl='',avatarRun=0,avatarKey='',avatarOwner='',avatarPending=null;
          function avatarInitial(){
            const p=typeof state!=='undefined'?state.profile:null;
            return String(p?.display_name||p?.full_name||'ب').trim().charAt(0)||'ب';
          }
          function paintAvatar(el,url=''){
            if(!el)return;
            const existing=el.querySelector(':scope > img');
            if(url){
              if(existing?.getAttribute('src')!==url){
                const img=document.createElement('img');img.alt='تصویر پروفایل';img.src=url;
                img.style.cssText='width:100%!important;height:100%!important;object-fit:cover!important;display:block!important;border-radius:50%!important';
                el.replaceChildren(img);
              }
              if(!el.classList.contains('has-image'))el.classList.add('has-image');
            }else{
              const initial=avatarInitial();if(existing||el.textContent!==initial)el.textContent=initial;
              if(el.classList.contains('has-image'))el.classList.remove('has-image');
            }
            if(el.style.backgroundImage)el.style.removeProperty('background-image');
          }
          function resetAvatar(){
            avatarRun++;avatarPending=null;avatarKey='';avatarOwner='';
            if(avatarObjectUrl)URL.revokeObjectURL(avatarObjectUrl);avatarObjectUrl='';
            paintAvatar(q('#avatar'));paintAvatar(q('#profileAvatarPreview'));
          }
          function refreshAvatarAfterLogin(){
            const p=typeof state!=='undefined'?state.profile:null,token=typeof state!=='undefined'?state.token:'';
            if(!p||!token){resetAvatar();return Promise.resolve()}
            if(!p.avatar_path){resetAvatar();return Promise.resolve()}
            const owner=p.id,pathValue=p.avatar_path,key=[owner,pathValue,p.updated_at||''].join('|');
            if(avatarKey===key&&avatarObjectUrl){
              paintAvatar(q('#avatar'),avatarObjectUrl);paintAvatar(q('#profileAvatarPreview'),avatarObjectUrl);
              return Promise.resolve();
            }
            if(avatarPending?.key===key)return avatarPending.promise;
            if(avatarOwner!==owner){resetAvatar();avatarOwner=owner}
            const run=++avatarRun;
            const promise=(async()=>{
              let nextUrl='';
              try{
                const path=String(pathValue).split('/').map(encodeURIComponent).join('/');
                const res=await fetch(`${SB_URL}/storage/v1/object/authenticated/avatars/${path}`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${token}`},cache:'no-store'});
                if(!res.ok)throw new Error(`avatar ${res.status}`);
                nextUrl=URL.createObjectURL(await res.blob());
                const image=new Image();image.src=nextUrl;await image.decode();
                if(run!==avatarRun||!state.token||state.profile?.id!==owner||state.profile?.avatar_path!==pathValue){URL.revokeObjectURL(nextUrl);return}
                const previous=avatarObjectUrl;avatarObjectUrl=nextUrl;avatarKey=key;
                paintAvatar(q('#avatar'),nextUrl);paintAvatar(q('#profileAvatarPreview'),nextUrl);
                if(previous)URL.revokeObjectURL(previous);
              }catch(err){
                if(nextUrl)URL.revokeObjectURL(nextUrl);
                // Keep the last decoded picture while a same-user refresh fails.
                if(run===avatarRun)console.error('post-login-avatar-sync',err);
              }finally{if(avatarPending?.run===run)avatarPending=null}
            })();
            avatarPending={key,run,promise};return promise;
          }
          function scheduleAvatar(){
            const app=q('#appView');if(app&&!app.classList.contains('hidden'))void refreshAvatarAfterLogin();
          }
          window.refreshProfileAvatar=refreshAvatarAfterLogin;

          '''
          path = 'assets/js/login-avatar-workload-fix-20260911.js'
          text = changes.get(path, Path(path).read_text(encoding='utf-8'))
          start = text.index("let avatarObjectUrl=''")
          end = text.index('function filteredTasks()', start)
          old_avatar = text[start:end]
          if old_avatar != new_avatar:
              if hashlib.sha256(old_avatar.encode()).hexdigest() != '543ece4a9c144e557478aa934734a00b04b98fe80f7e9e03ecdbf3c8a0808ebd':
                  raise SystemExit('Avatar implementation changed; review before applying')
              changes[path] = text[:start] + new_avatar + text[end:]
          replace_once(path,
              "new MutationObserver(()=>{if(!app.classList.contains('hidden'))scheduleAvatar()})",
              "new MutationObserver(()=>{if(!app.classList.contains('hidden'))scheduleAvatar();else resetAvatar()})")
          path = 'index.html'
          text = Path(path).read_text(encoding='utf-8')
          for name in ['app.js','messaging-history-root-20260911.js','dashboard-response-fixes-20260911.js',
                       'login-avatar-workload-fix-20260911.js','workload-segment-labels-20260911.js']:
              pattern = r'(assets/js/' + re.escape(name) + r'\?v=)[^"\s>]+'
              text, count = re.subn(pattern, r'\g<1>profile-counts-20260911-1', text)
              if count != 1:
                  raise SystemExit(f'Unexpected asset reference for {name}')
          changes[path] = text
          for path,text in changes.items():
              if '\ufffd' in text:
                  raise SystemExit(f'Invalid UTF-8 replacement character in {path}')
          for path,text in changes.items():
              Path(path).write_text(text,encoding='utf-8')
              print('Updated '+path)
          PY
          for f in assets/js/app.js assets/js/messaging-history-root-20260911.js assets/js/dashboard-response-fixes-20260911.js assets/js/login-avatar-workload-fix-20260911.js assets/js/workload-segment-labels-20260911.js; do
            node --check "$f"
          done
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify profile photos and plain counts on desktop and mobile
        run: python tests/browser/check_profile_photo_workload_counts.py
      - name: Preserve the post-welcome viewport fix
        run: python tests/browser/check_post_welcome.py
      - name: Upload isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-photo-workload-regressions
          path: |
            test-results/avatar-workload/
            test-results/post-welcome/
          retention-days: 7
      - name: Commit only verified application corrections
        run: |
          if git diff --quiet -- assets/js index.html; then
            echo 'Source already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/app.js assets/js/messaging-history-root-20260911.js assets/js/dashboard-response-fixes-20260911.js assets/js/login-avatar-workload-fix-20260911.js assets/js/workload-segment-labels-20260911.js index.html
          git commit -m 'Preserve profile photos and use consistent plain workload counts'
          git push origin HEAD:main
