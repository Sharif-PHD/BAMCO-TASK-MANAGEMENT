name: One-shot BAMCO optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bamco-optimize.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install transient CSS optimizer
        id: deps
        continue-on-error: true
        run: npm install --no-save --no-package-lock postcss postcss-discard-duplicates postcss-normalize-whitespace

      - name: Optimize self-contained index
        id: optimize
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const postcss = require('postcss');
          const load = name => { const m = require(name); return m.default || m; };
          const discardDuplicates = load('postcss-discard-duplicates');
          const normalizeWhitespace = load('postcss-normalize-whitespace');

          (async()=>{
            const path = 'index.html';
            let html = fs.readFileSync(path, 'utf8');
            const beforeBytes = Buffer.byteLength(html);
            const beforeSources = (html.match(/\/\*\s*Source:/g) || []).length;
            const beforeObservers = (html.match(/new MutationObserver/g) || []).length;

            const oldWorkbench = "const boot=()=>{refresh();const app=q('#appView');if(app)new MutationObserver(()=>requestAnimationFrame(refresh)).observe(app,{childList:true,subtree:true})};";
            const newWorkbench = "const boot=()=>{refresh();const targets=[q('#kanbanView'),q('#archiveView')].filter(Boolean);let raf=0;if(targets.length){const observer=new MutationObserver(()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;refresh()})});targets.forEach(el=>observer.observe(el,{childList:true,subtree:true}))}};";
            if (!html.includes(oldWorkbench)) throw new Error('table-workbench global observer signature not found');
            if (html.split(oldWorkbench).length !== 2) throw new Error('table-workbench observer signature is not unique');
            html = html.replace(oldWorkbench, newWorkbench);

            const oldSelection = "const tableObserver=new MutationObserver(moveSelectionToRight);";
            const newSelection = "let selectionRaf=0;const tableObserver=new MutationObserver(()=>{if(selectionRaf)return;selectionRaf=requestAnimationFrame(()=>{selectionRaf=0;moveSelectionToRight()})});";
            if (!html.includes(oldSelection)) throw new Error('table selection observer signature not found');
            if (html.split(oldSelection).length !== 2) throw new Error('table selection observer signature is not unique');
            html = html.replace(oldSelection, newSelection);

            const styleRe = /(<style id="bamcoUnifiedStyles">)([\s\S]*?)(<\/style>)/;
            const match = html.match(styleRe);
            if (!match) throw new Error('bamcoUnifiedStyles block not found');
            const root = postcss.parse(match[2], { from: undefined });
            root.walkComments(c => c.remove());
            const processed = await postcss([discardDuplicates(), normalizeWhitespace()]).process(root, { from: undefined });
            html = html.replace(styleRe, `$1${processed.css}$3`);

            const mustKeep = [
              'loginForm','kanbanView','archiveView','taskForm','var XLSX={}',
              'taskTimelineView','vehiclePermanentView','vehicleTemporaryView',
              'data-login-controls','data-user-request-fixes-v2','SB_URL','SB_KEY'
            ];
            for (const marker of mustKeep) if (!html.includes(marker)) throw new Error(`required feature marker missing: ${marker}`);

            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            for (let i=0;i<scripts.length;i++) {
              const code = scripts[i][1];
              if (!code.trim()) continue;
              try { new Function(code); }
              catch (e) { throw new Error(`inline script ${i+1} syntax error: ${e.message}`); }
            }

            if (!/^<!doctype html>/i.test(html.trimStart()) || !/<\/html>\s*$/i.test(html.trimEnd())) throw new Error('HTML envelope invalid');
            const afterBytes = Buffer.byteLength(html);
            if (afterBytes >= beforeBytes) throw new Error(`optimized file did not shrink (${beforeBytes} -> ${afterBytes})`);

            fs.writeFileSync(path, html);
            console.log(`before_bytes=${beforeBytes}`);
            console.log(`after_bytes=${afterBytes}`);
            console.log(`saved_bytes=${beforeBytes-afterBytes}`);
            console.log(`source_markers_before=${beforeSources}`);
            console.log(`source_markers_after=${(html.match(/\/\*\s*Source:/g)||[]).length}`);
            console.log(`mutation_observers=${beforeObservers}`);
            console.log('runtime_observer_scope=kanban+archive');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          test -f .nojekyll
          test ! -s .nojekyll
          git diff --check

      - name: Commit result and remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/bamco-optimize.yml
          if [ "${{ steps.optimize.outcome }}" = "success" ]; then
            git add index.html
            git commit -m "perf: streamline self-contained app without feature loss"
          else
            git restore --staged index.html 2>/dev/null || true
            git checkout -- index.html 2>/dev/null || true
            git commit -m "chore: remove one-shot optimizer"
          fi
          git push
