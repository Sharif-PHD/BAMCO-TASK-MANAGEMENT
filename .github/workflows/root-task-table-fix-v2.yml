name: Root task table fix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-task-table-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch source of Kanban and archive tables
        run: |
          python - <<'PY'
          from pathlib import Path

          # index.html
          p=Path('index.html'); s=p.read_text()
          pairs=[
            ('<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>انتخاب</th></tr><tr class="column-filters">','<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>تعجیل</th></tr><tr class="column-filters">'),
            ('<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>تأخیر</th><th>تعجیل</th><th>انتخاب</th></tr><tr class="column-filters">','<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>تأخیر</th><th>تعجیل</th></tr><tr class="column-filters">'),
            ('assets/js/app.js?v=profile-counts-20260911-1','assets/js/app.js?v=task-table-root-20260912-1'),
            ('assets/js/avatar-final-20260911.js?v=20260911-1','assets/js/avatar-final-20260911.js?v=task-table-root-20260912-1'),
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit('index invariant missing: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)

          # app.js
          p=Path('assets/js/app.js'); s=p.read_text()
          if 'colspan="${archived?16:14}"' not in s: raise SystemExit('empty colspan source missing')
          s=s.replace('colspan="${archived?16:14}"','colspan="${archived?15:14}"',1)
          old='''    const selected=String(state.selected[scope])===String(t.id),pick=`<td class="fa-text"><input class="task-pick" type="radio" name="${scope}Task" value="${t.id}" ${selected?'checked':''} aria-label="انتخاب وظیفه ${safe(displayId(t))}"></td>`;\n    if(archived)return `<tr class="${rowClass} ${selected?'task-selected':''}" data-task-id="${t.id}" data-scope="archive">${common}${cell(fa(t.delay_days||0))}${cell(fa(t.advance_days||0))}${pick}</tr>`;\n    return `<tr class="${rowClass} ${selected?'task-selected':''}" data-task-id="${t.id}" data-scope="kanban">${common}${pick}</tr>`}).join('');'''
          new='''    const selected=String(state.selected[scope])===String(t.id);\n    if(archived)return `<tr class="${rowClass} ${selected?'task-selected':''}" data-task-id="${t.id}" data-scope="archive">${common}${cell(fa(t.delay_days||0))}${cell(fa(t.advance_days||0))}</tr>`;\n    return `<tr class="${rowClass} ${selected?'task-selected':''}" data-task-id="${t.id}" data-scope="kanban">${common}${cell(fa(t.advance_days||0))}</tr>`}).join('');'''
          if old not in s: raise SystemExit('native row renderer source missing')
          s=s.replace(old,new,1)
          old="return archived?[...base,fa(t.delay_days||0),fa(t.advance_days||0),'']: [...base,'']"
          new="return archived?[...base,fa(t.delay_days||0),fa(t.advance_days||0)]:[...base,fa(t.advance_days||0)]"
          if old not in s: raise SystemExit('column value source missing')
          s=s.replace(old,new,1)
          n=s.count('count=archived?15:13;')
          if n<1: raise SystemExit('filter count source missing')
          s=s.replace('count=archived?15:13;','count=archived?15:14;')
          p.write_text(s)

          # task-bulk-delete: selection is row-driven, never header/input-driven.
          p=Path('assets/js/task-bulk-delete-20260912.js'); s=p.read_text()
          if 'if(window.__bamcoTaskBulkDelete20260912V3)return;' in s:
              s=s.replace('if(window.__bamcoTaskBulkDelete20260912V3)return;\nwindow.__bamcoTaskBulkDelete20260912V3=true;',
                          'if(window.__bamcoTaskBulkDelete20260912V4)return;\nwindow.__bamcoTaskBulkDelete20260912V4=true;\nwindow.__bamcoTaskBulkDelete20260912V3=true;',1)
          start=s.find('function ensureHeaderToggle(scope){')
          end=s.find('function syncToolbar(scope){')
          if start<0 or end<0 or end<=start: raise SystemExit('select-all helper block missing')
          s=s[:start]+"function removeLegacySelectAll(){qa('[data-bamco-task-select-all]').forEach(input=>{const label=input.closest('label');if(label)label.remove();else input.remove()})}\n"+s[end:]
          old="  const visible=visibleIds(scope),all=ensureHeaderToggle(scope);\n  if(all){const selectedVisible=visible.filter(id=>picked[scope].has(id)).length;all.checked=visible.length>0&&selectedVisible===visible.length;all.indeterminate=selectedVisible>0&&selectedVisible<visible.length;all.disabled=visible.length===0}\n"
          if old not in s: raise SystemExit('select-all toolbar block missing')
          s=s.replace(old,"  removeLegacySelectAll();\n",1)
          old="    const id=String(row.dataset.taskId),input=q('input.task-pick',row);if(!input)return;\n    if(input.type!=='checkbox')input.type='checkbox';input.removeAttribute('name');\n    const selected=picked[scope].has(id);\n    input.checked=selected;input.setAttribute('aria-checked',selected?'true':'false');\n    row.classList.toggle('task-selected',selected);row.setAttribute('aria-selected',selected?'true':'false');row.dataset.bamcoSelected=selected?'1':'0';\n"
          new="    const id=String(row.dataset.taskId),input=q('input.task-pick',row),selected=picked[scope].has(id);\n    if(input){input.checked=selected;input.setAttribute('aria-checked',selected?'true':'false');input.style.setProperty('display','none','important');input.setAttribute('aria-hidden','true')}\n    row.classList.toggle('task-selected',selected);row.setAttribute('aria-selected',selected?'true':'false');row.dataset.bamcoSelected=selected?'1':'0';\n"
          if old not in s: raise SystemExit('decorate block missing')
          s=s.replace(old,new,1)
          s=s.replace('  ensureStyles();purgeRequestReport();','  ensureStyles();removeLegacySelectAll();purgeRequestReport();',1)
          p.write_text(s)

          # bump late loader cache key so existing browsers cannot reuse prior selector bundle.
          p=Path('assets/js/avatar-final-20260911.js'); s=p.read_text()
          if 'task-bulk-delete-20260912.js?v=20260912-3' in s:
              s=s.replace('task-bulk-delete-20260912.js?v=20260912-3','task-bulk-delete-20260912.js?v=20260912-4',1)
          p.write_text(s)
          PY
      - name: Verify fixed sources
        run: |
          set -euo pipefail
          ! grep -q '<th>انتخاب</th>' index.html
          grep -q '<th>توضیحات مدیر</th><th>تعجیل</th></tr>' index.html
          grep -q '<th>تأخیر</th><th>تعجیل</th></tr>' index.html
          grep -q 'task-table-root-20260912-1' index.html
          grep -q '__bamcoTaskBulkDelete20260912V4' assets/js/task-bulk-delete-20260912.js
          ! grep -q 'ensureHeaderToggle' assets/js/task-bulk-delete-20260912.js
          ! grep -q 'type="radio" name="${scope}Task"' assets/js/app.js
      - name: Commit and push root fix
        run: |
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/js/app.js assets/js/task-bulk-delete-20260912.js assets/js/avatar-final-20260911.js
          git commit -m 'Fix task tables at source'
          git push
