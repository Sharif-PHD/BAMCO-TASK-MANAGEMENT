name: Apply task deselection cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-task-deselect-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bump app cache key
        run: python .github/scripts/bump_task_deselect_cache.py
      - name: Commit and push
        run: |
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Force fresh task deselection runtime'
          git push
