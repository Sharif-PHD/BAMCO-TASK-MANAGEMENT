name: Task table filter repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task-table-filter-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair task table source and filter initialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()

          # Kanban must end at manager notes. Archive keeps delay + advance.
          k_start = html.index('<section id="kanbanView"')
          k_end = html.index('<section id="archiveView"', k_start)
          kanban = html[k_start:k_end]
          old = '<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>تعجیل</th></tr>'
          new = '<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th></tr>'
          if old not in kanban:
              raise SystemExit('kanban terminal header pattern not found')
          kanban = kanban.replace(old, new, 1)
          html = html[:k_start] + kanban + html[k_end:]

          html = html.replace('assets/js/app.js?v=task-table-root-20260912-1',
                              'assets/js/app.js?v=task-filter-repair-20260912-1', 1)
          html = html.replace('assets/js/avatar-final-20260911.js?v=task-table-root-20260912-1',
                              'assets/js/avatar-final-20260911.js?v=task-filter-repair-20260912-1', 1)
          index.write_text(html)

          app = Path('assets/js/app.js')
          s = app.read_text()
          replacements = [
              ('colspan="${archived?15:14}"', 'colspan="${archived?15:13}"', 'empty colspan'),
              ('return `<tr class="${rowClass} ${selected?\'task-selected\':\'\'}" data-task-id="${t.id}" data-scope="kanban">${common}${cell(fa(t.advance_days||0))}</tr>`',
               'return `<tr class="${rowClass} ${selected?\'task-selected\':\'\'}" data-task-id="${t.id}" data-scope="kanban">${common}</tr>`', 'kanban row terminal cell'),
              ('return archived?[...base,fa(t.delay_days||0),fa(t.advance_days||0)]:[...base,fa(t.advance_days||0)]',
               'return archived?[...base,fa(t.delay_days||0),fa(t.advance_days||0)]:base', 'column values'),
              ('count=archived?15:14;', 'count=archived?15:13;', 'filter column count'),
          ]
          for old_text, new_text, label in replacements:
              if old_text not in s:
                  raise SystemExit(f'{label}: source pattern not found')
              s = s.replace(old_text, new_text, 1)
          app.write_text(s)

          # Remove the late terminal-column normalizer from the production load path.
          # It used to prefill the empty filter row with spacer TH elements before
          # app.js could build the actual SELECT filters, which is why filters vanished.
          avatar = Path('assets/js/avatar-final-20260911.js')
          avatar.write_text("""(()=>{\n'use strict';\nif(window.__bamcoFinalProductionFixLoader20260911)return;\nwindow.__bamcoFinalProductionFixLoader20260911=true;\nconst loadFinal=()=>{\n  if(document.querySelector('script[data-bamco-final-production-fixes]'))return;\n  const s=document.createElement('script');\n  s.src='assets/js/final-production-fixes-20260911.js?v=task-filter-repair-20260912-1';\n  s.dataset.bamcoFinalProductionFixes='1';\n  s.async=false;\n  document.head.appendChild(s);\n};\nconst load=()=>{\n  const existing=document.querySelector('script[data-bamco-task-bulk-delete]');\n  if(existing){if(existing.dataset.loaded==='1')loadFinal();else existing.addEventListener('load',loadFinal,{once:true});return}\n  const s=document.createElement('script');\n  s.src='assets/js/task-bulk-delete-20260912.js?v=20260912-4';\n  s.dataset.bamcoTaskBulkDelete='1';\n  s.async=false;\n  s.addEventListener('load',()=>{s.dataset.loaded='1';loadFinal()},{once:true});\n  s.addEventListener('error',loadFinal,{once:true});\n  document.head.appendChild(s);\n};\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();\n})();\n""")
          PY
      - name: Verify repaired source invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          k=html[html.index('<section id="kanbanView"'):html.index('<section id="archiveView"')]
          a=html[html.index('<section id="archiveView"'):html.index('<section id="approvalsView"')]
          assert '<th>توضیحات مدیر</th></tr>' in k
          assert '<th>توضیحات مدیر</th><th>تعجیل</th>' not in k
          assert '<th>تأخیر</th><th>تعجیل</th></tr>' in a
          app=Path('assets/js/app.js').read_text()
          assert 'count=archived?15:13;' in app
          assert 'colspan="${archived?15:13}"' in app
          assert 'data-scope="kanban">${common}</tr>' in app
          assert 'return archived?[...base,fa(t.delay_days||0),fa(t.advance_days||0)]:base' in app
          loader=Path('assets/js/avatar-final-20260911.js').read_text()
          assert 'task-terminal-columns-20260912.js' not in loader
          assert 'loadColumns' not in loader
          PY
      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/js/app.js assets/js/avatar-final-20260911.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove Kanban terminal column and restore task filters'
          git push
