name: Documents sites regression gate
on:
  push:
    branches: [documents-sites-feature-20260912]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: documents-sites-feature-20260912
          path: feature
          fetch-depth: 1
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            feature/package-lock.json
            baseline/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix feature && npm ci --prefix baseline
      - name: Feature focused tests
        working-directory: feature
        run: node --check assets/js/documents-sites.js && node --test tests/documents-sites.test.cjs
      - name: Run full feature and baseline suites
        shell: bash
        run: |
          set +e
          (cd feature && npm test) > /tmp/feature.tap 2>&1
          FEATURE_EXIT=$?
          (cd baseline && npm test) > /tmp/baseline.tap 2>&1
          BASE_EXIT=$?
          set -e
          echo "feature_exit=$FEATURE_EXIT baseline_exit=$BASE_EXIT"
          python - <<'PY'
          import re, pathlib, sys
          def failed(path):
              text=pathlib.Path(path).read_text(errors='replace')
              names=[]
              for line in text.splitlines():
                  m=re.match(r'\s*not ok \d+ - (.*)',line)
                  if m: names.append(m.group(1).strip())
              return set(names),text
          f,ft=failed('/tmp/feature.tap'); b,bt=failed('/tmp/baseline.tap')
          new=sorted(f-b)
          print('Baseline failures:',len(b)); [print('  BASE:',x) for x in sorted(b)]
          print('Feature failures:',len(f)); [print('  FEATURE:',x) for x in sorted(f)]
          if new:
              print('NEW REGRESSIONS:'); [print('  NEW:',x) for x in new]
              print('\n--- feature tail ---\n'+ '\n'.join(ft.splitlines()[-120:]))
              sys.exit(1)
          print('REGRESSION_COMPARISON_PASS')
          PY
      - name: Remove temporary regression workflow and commit cleanup
        working-directory: feature
        run: |
          rm .github/workflows/documents-sites-regression-gate.yml
          git config user.name "BAMCO Feature Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u .github/workflows/documents-sites-regression-gate.yml
          git commit -m "Complete documents and sites regression gate"
          git push origin HEAD:documents-sites-feature-20260912
