name: Performance report live regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-report-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for performance command bar build
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 40); do
            html="$(curl -fsSL --connect-timeout 10 "${BASE}?perf-toolbar=${GITHUB_SHA}-${i}" || true)"
            report="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/report-stability-fixes-20260911.js?perf-toolbar=${GITHUB_SHA}-${i}" || true)"
            interior="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/interior-ui.js?perf-toolbar=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'report-stability-fixes-20260911.js?v=performance-toolbar-root-20260912-2' <<<"$html" \
              && grep -q 'assets/js/interior-ui.js' <<<"$html" \
              && grep -q '__bamcoCanonicalReportsLiveSyncV5' <<<"$report" \
              && grep -q 'workspace-report-tools canonical-report-tools performance-command-row' <<<"$report" \
              && grep -q '>خروجی اکسل</button>' <<<"$report" \
              && ! grep -q 'canonicalPerfSearch' <<<"$report" \
              && ! grep -q 'data-performance-home' <<<"$report" \
              && ! grep -q 'خروجی اکسل فیلترشده' <<<"$report" \
              && grep -q 'window.bamcoInteriorUI={decorateView}' <<<"$interior"; then
              ready=1; break
            fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify performance report command bar
        shell: bash
        run: |
          cat > /tmp/check_performance_toolbar.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1900,'height':900})
                  await page.route('**/rest/v1/change_requests**', lambda route: route.fulfill(status=200,content_type='application/json',body='[]'))
                  await page.goto(BASE+'?perf-toolbar-live=3',wait_until='networkidle')
                  await page.wait_for_function("window.__bamcoCanonicalReportsLiveSyncV5===true && window.bamcoCanonicalReports?.renderPerformance")
                  assert await page.locator('script[src*="report-root-fixes-20260911.js"]').count() == 0
                  assert await page.locator('script[src*="report-stability-fixes-20260911.js"]').count() == 1
                  assert await page.locator('script[src*="interior-ui.js"]').count() == 1
                  if not await page.evaluate("!!window.bamcoInteriorUI?.decorateView"):
                      await page.add_script_tag(url=BASE+'assets/js/interior-ui.js?live-verify=3')
                  await page.wait_for_function("!!window.bamcoInteriorUI?.decorateView")
                  await page.evaluate("""async () => {
                    document.body.classList.remove('department-pending');
                    document.querySelector('#departmentEntry')?.setAttribute('hidden','');
                    document.querySelector('#loginView')?.classList.add('hidden');
                    document.querySelector('#appView')?.classList.remove('hidden');
                    document.querySelectorAll('dialog[open]').forEach(d=>{try{d.close()}catch{}});
                    state.profile={id:'manager',role:'manager',active:true,full_name:'مدیر'};
                    state.profiles=[
                      {id:'owner-a',display_name:'متولی نمونه الف',active:true},
                      {id:'owner-b',display_name:'متولی نمونه ب',active:true}
                    ];
                    const p=currentJalali();
                    const due=jalaliToISO(p.y,p.m,Math.min(5,p.d||5));
                    const make=(id,owner,done)=>({id,legacy_id:id,title:'کار '+id,owner_id:owner,status:done?'انجام شده':'در حال انجام',priority:'متوسط',due_date:due,start_date:due,done_date:done?due:null,archived:done,due_state:'',_testDone:done});
                    state.tasks=[make(1,'owner-a',true),make(2,'owner-a',true),make(3,'owner-a',true),make(4,'owner-a',true),make(5,'owner-a',false),make(6,'owner-b',false)];
                    if(window.bamcoOptions){window.bamcoOptions.completed=t=>!!t._testDone;window.bamcoOptions.terminal=t=>!!t._testDone;}
                    Object.defineProperty(state,'view',{configurable:true,get:()=> 'performanceReport',set:()=>{}});
                    try{await window.bamcoCanonicalReports.renderPerformance(true)}finally{delete state.view;state.view='performanceReport'}
                    window.bamcoInteriorUI.decorateView(document.querySelector('#performanceReportView'));
                  }""")
                  await page.wait_for_function("""() => {
                    const v=document.querySelector('#performanceReportView');
                    const head=v?.querySelector(':scope > .bamco-page-heading');
                    const bar=v?.querySelector(':scope > .performance-command-row');
                    const body=v?.querySelector(':scope > .canonical-report');
                    return !!(head && bar && body && head.nextElementSibling===bar && bar.nextElementSibling===body && v.querySelectorAll('input[type=search]').length===0);
                  }""", timeout=5000)

                  view=page.locator('#performanceReportView')
                  toolbar=view.locator(':scope > .performance-command-row')
                  assert await toolbar.count()==1
                  assert await toolbar.evaluate("el=>el.classList.contains('bamco-command-bar')")
                  assert await toolbar.locator('.content-back').count()==1
                  assert (await toolbar.locator('.content-back').text_content()).strip()=='بازگشت به خانه'
                  for sel in ['[data-performance-from]','[data-performance-to]','[data-canonical-perf-clear]','[data-canonical-refresh="performanceReport"]','[data-canonical-export="performance"]']:
                      assert await toolbar.locator(sel).count()==1,sel
                  assert (await toolbar.locator('[data-canonical-export="performance"]').text_content()).strip()=='خروجی اکسل'
                  assert await view.locator('input[type=search]').count()==0
                  assert await view.locator('[data-performance-home]').count()==0
                  header_cells=view.locator('thead tr').first.locator('th')
                  headers=[(await header_cells.nth(i).text_content()).strip() for i in range(await header_cells.count())]
                  assert len(headers)==9,headers
                  assert headers[0]=='متولی',headers
                  row=view.locator('tbody tr[data-canonical-row]').first
                  progress=row.locator('.performance-progress')
                  assert await progress.count()==1
                  assert 'high' in (await progress.get_attribute('class'))
                  assert '80%' in (await progress.get_attribute('style'))
                  owner=await view.get_attribute('data-canonical-report-owner')
                  assert owner=='5',owner
                  weights=await toolbar.locator('button').evaluate_all("els=>els.map(e=>getComputedStyle(e).fontWeight)")
                  assert all(w not in ('600','700','bold','800','900') for w in weights),weights
                  print(json.dumps({'toolbar':'between-heading-and-body','search':'absent','export':'خروجی اکسل','single_back':True,'columns':len(headers),'progress':'80%-high','owner':owner,'status':'passed'},ensure_ascii=False))
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/check_performance_toolbar.py