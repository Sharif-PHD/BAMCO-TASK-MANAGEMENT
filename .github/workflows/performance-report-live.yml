name: Performance report live regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-report-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for canonical performance report build
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 40); do
            html="$(curl -fsSL --connect-timeout 10 "${BASE}?perf-root=${GITHUB_SHA}-${i}" || true)"
            report="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/report-stability-fixes-20260911.js?perf-root=${GITHUB_SHA}-${i}" || true)"
            styled="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/styled-excel.js?perf-root=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'report-stability-fixes-20260911.js?v=performance-root-20260912-1' <<<"$html" \
              && ! grep -q 'report-root-fixes-20260911.js' <<<"$html" \
              && grep -q '__bamcoCanonicalReportsLiveSyncV4' <<<"$report" \
              && grep -q "const headers=\['متولی'" <<<"$report" \
              && grep -q 'performance-progress' <<<"$report" \
              && grep -q 'خروجی اکسل فیلترشده' <<<"$report" \
              && grep -q "filter(r=>!r.hidden)" <<<"$report" \
              && grep -q "'!autofilter'" <<<"$report" \
              && grep -q 'borderId:plain?0:1' <<<"$styled"; then
              ready=1; break
            fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify performance report UI and ownership
        shell: bash
        run: |
          cat > /tmp/check_performance.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1600,'height':900})
                  errors=[]
                  page.on('pageerror',lambda exc: errors.append(str(exc)))
                  await page.route('**/rest/v1/change_requests**', lambda route: route.fulfill(status=200,content_type='application/json',body='[]'))
                  await page.goto(BASE+'?perf-live=2',wait_until='networkidle')
                  await page.wait_for_function("window.__bamcoCanonicalReportsLiveSyncV4===true && window.bamcoCanonicalReports?.renderPerformance")
                  assert await page.locator('script[src*="report-root-fixes-20260911.js"]').count() == 0
                  assert await page.locator('script[src*="report-stability-fixes-20260911.js"]').count() == 1
                  await page.evaluate("""async () => {
                    document.body.classList.remove('department-pending');
                    document.querySelector('#departmentEntry')?.setAttribute('hidden','');
                    document.querySelector('#loginView')?.classList.add('hidden');
                    document.querySelector('#appView')?.classList.remove('hidden');
                    document.querySelectorAll('dialog[open]').forEach(d=>{try{d.close()}catch{}});
                    state.profile={id:'manager',role:'manager',active:true,full_name:'مدیر'};
                    state.profiles=[
                      {id:'owner-a',display_name:'متولی نمونه الف',active:true},
                      {id:'owner-b',display_name:'متولی نمونه ب',active:true}
                    ];
                    const p=currentJalali();
                    const due=jalaliToISO(p.y,p.m,Math.min(5,p.d||5));
                    const make=(id,owner,done)=>({id,legacy_id:id,title:'کار '+id,owner_id:owner,status:done?'انجام شده':'در حال انجام',priority:'متوسط',due_date:due,start_date:due,done_date:done?due:null,archived:done,due_state:'',_testDone:done});
                    state.tasks=[make(1,'owner-a',true),make(2,'owner-a',true),make(3,'owner-a',true),make(4,'owner-a',true),make(5,'owner-a',false),make(6,'owner-b',false)];
                    if(window.bamcoOptions){window.bamcoOptions.completed=t=>!!t._testDone;window.bamcoOptions.terminal=t=>!!t._testDone;}
                    state.view='performanceReport';
                    await window.bamcoCanonicalReports.renderPerformance(true);
                  }""")
                  await page.wait_for_timeout(250)
                  headers=[(await page.locator('#performanceReportView thead th').nth(i).text_content()).strip() for i in range(await page.locator('#performanceReportView thead th').count())]
                  assert len(headers)==9,headers
                  assert headers[0]=='متولی',headers
                  assert 'شناسه متولی' not in headers,headers
                  row=page.locator('#performanceReportView tbody tr[data-canonical-row]').first
                  assert await row.locator('td').count()==9
                  assert (await row.locator('td').first.text_content()).strip()=='متولی نمونه الف'
                  progress=row.locator('.performance-progress')
                  assert await progress.count()==1
                  assert 'high' in (await progress.get_attribute('class'))
                  assert '80%' in (await progress.get_attribute('style'))
                  assert (await progress.locator('span').text_content()).strip()=='۸۰٪'
                  toolbar=page.locator('#performanceReportView .performance-command-row')
                  assert await toolbar.count()==1
                  assert await toolbar.locator('[data-performance-home]').count()==1
                  assert await toolbar.locator('[data-performance-from]').count()==1
                  assert await toolbar.locator('[data-performance-to]').count()==1
                  assert await toolbar.locator('[data-canonical-perf-clear]').count()==1
                  assert await toolbar.locator('[data-canonical-refresh="performanceReport"]').count()==1
                  assert await toolbar.locator('[data-canonical-export="performance"]').count()==1
                  assert (await toolbar.locator('[data-canonical-export="performance"]').text_content()).strip()=='خروجی اکسل فیلترشده'
                  weights=await toolbar.locator('button').evaluate_all("els=>els.map(e=>getComputedStyle(e).fontWeight)")
                  assert all(w not in ('600','700','bold','800','900') for w in weights),weights
                  owner=await page.locator('#performanceReportView').get_attribute('data-canonical-report-owner')
                  assert owner=='4',owner
                  print(json.dumps({'columns':headers,'progress':'80%-high','toolbar':'single-row','font_weights':weights,'owner':owner,'legacy_report_root':'absent','status':'passed'},ensure_ascii=False))
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/check_performance.py
