name: Login hotfix test and patch

on:
  push:
    branches:
      - login-hotfix-native-20260909

permissions:
  contents: write

jobs:
  validate-and-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: login-hotfix-native-20260909
          fetch-depth: 0

      - name: Syntax check login script
        run: node --check assets/js/auth-ui.js

      - name: Move login script before heavy application boot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script defer src="assets/js/auth-ui.js?v=20260909-2" data-login-controls></script>'
          new='<script src="assets/js/auth-ui.js?v=20260909-native-1" data-login-controls></script>'
          if old in s:
              s=s.replace(old,'',1)
          if new not in s:
              marker='  </main>'
              if marker not in s:
                  raise SystemExit('login </main> marker not found')
              s=s.replace(marker, marker+'\n\n  '+new, 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static login assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=Path('assets/js/auth-ui.js').read_text(encoding='utf-8')
          new='<script src="assets/js/auth-ui.js?v=20260909-native-1" data-login-controls></script>'
          assert s.count(new)==1, 'new login script must appear exactly once'
          assert 'assets/js/auth-ui.js?v=20260909-2' not in s, 'old cached login URL remains'
          assert s.index(new) < s.index('<div id="appView"'), 'login script is not before app shell'
          assert s.index(new) < s.index('assets/js/shell.js'), 'login script is not before heavy scripts'
          assert 'login-verify-native' in js, 'native verification input missing'
          assert 'opacity:.02' not in js and 'color:transparent' not in js, 'hidden verification input remains'
          assert 'opacity:1!important' in js, 'visible verification safety rule missing'
          print('static assertions: PASS')
          PY

      - name: Browser smoke test
        run: |
          cat > .login-smoke.html <<'HTML'
          <!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>.hidden{display:none}</style></head><body>
          <main id="loginView"><section class="login-card"><div class="brand-lockup"><img alt="logo"><h1>سامانه</h1></div><form id="loginForm"><label>نام کاربری</label><input id="email"><label>رمز عبور</label><input id="password" type="password"><button type="submit">ورود</button><p id="loginError"></p></form></section></main>
          <div id="appView" class="hidden"></div>
          <script src="assets/js/auth-ui.js"></script>
          <script>
          window.addEventListener('DOMContentLoaded',()=>{
            const form=document.querySelector('#loginForm');
            const input=document.querySelector('#loginVerifyCode');
            const box=document.querySelector('#loginVerification');
            const cs=input?getComputedStyle(input):null;
            const checks=[];
            checks.push(!!input);
            checks.push(!!box && /^\d{4}$/.test(box.dataset.code||''));
            checks.push(!!cs && Number(cs.opacity)===1);
            checks.push(!!cs && cs.pointerEvents!=='none');
            if(input){input.focus();checks.push(document.activeElement===input);input.value=box.dataset.code;input.dispatchEvent(new Event('input',{bubbles:true}));const good=new Event('submit',{bubbles:true,cancelable:true});form.dispatchEvent(good);checks.push(good.defaultPrevented===false);input.value='0000';const bad=new Event('submit',{bubbles:true,cancelable:true});form.dispatchEvent(bad);checks.push(bad.defaultPrevented===true)}
            document.body.dataset.loginTest=checks.every(Boolean)?'pass':'fail';
            document.body.dataset.loginChecks=JSON.stringify(checks);
          });
          </script></body></html>
          HTML
          python3 -m http.server 8765 >/tmp/bamco-login-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=1500 --dump-dom http://127.0.0.1:8765/.login-smoke.html > /tmp/login-dom.txt
          grep -q 'data-login-test="pass"' /tmp/login-dom.txt
          echo 'browser smoke: PASS'

      - name: Commit tested index patch
        run: |
          rm -f .login-smoke.html
          if git diff --quiet -- index.html; then
            echo 'No index patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load native login before heavy application scripts'
          git push origin HEAD:login-hotfix-native-20260909
