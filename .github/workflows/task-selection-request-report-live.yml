name: Task selection and request report live regression

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/task-bulk-delete-20260912.js'
      - 'assets/js/avatar-final-20260911.js'
      - 'assets/js/production-runtime.js'
      - '.github/workflows/task-selection-request-report-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 30); do
            bulk="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/task-bulk-delete-20260912.js?probe=${GITHUB_SHA}-${i}" || true)"
            runtime="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/production-runtime.js?probe=${GITHUB_SHA}-${i}" || true)"
            if grep -q '__bamcoTaskBulkDelete20260912V3' <<<"$bulk" && grep -q "const REMOVED=new Set(\['requestReport'\])" <<<"$runtime"; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify selected task rows turn green and request report is absent
        shell: bash
        run: |
          cat > /tmp/check_selection_report.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1365,'height':900})
                  await page.goto(BASE+'?selection-report-live=1', wait_until='networkidle')
                  await page.wait_for_function('window.__bamcoTaskBulkDelete20260912V3 === true')
                  await page.wait_for_timeout(250)

                  assert await page.locator('#nav button[data-view="requestReport"]').count() == 0
                  assert await page.locator('#requestReportView').count() == 0

                  await page.evaluate("""() => {
                    state.profile={id:'00000000-0000-0000-0000-000000000001',role:'manager',active:true,full_name:'مدیر'};
                    state.tasks=[
                      {id:91001,legacy_id:1,title:'Task one',archived:false},
                      {id:91002,legacy_id:2,title:'Task two',archived:false}
                    ];
                    state.selected={kanban:null,archive:null};
                    const body=document.querySelector('#kanbanBody');
                    body.innerHTML=`
                      <tr data-task-id="91001" data-scope="kanban"><td>1</td><td>Task one</td><td><input class="task-pick" type="radio" value="91001"></td></tr>
                      <tr data-task-id="91002" data-scope="kanban"><td>2</td><td>Task two</td><td><input class="task-pick" type="radio" value="91002"></td></tr>`;
                  }""")
                  await page.wait_for_function("() => [...document.querySelectorAll('#kanbanBody input.task-pick')].every(x=>x.type==='checkbox')")

                  await page.evaluate("() => document.querySelector('#kanbanBody tr[data-task-id=\"91001\"] td:nth-child(2)').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))")
                  await page.wait_for_function("() => window.bamcoTaskSelection.count('kanban')===1")
                  assert await page.locator('#kanbanBody tr[data-task-id="91001"]').evaluate("el=>el.classList.contains('task-selected')")
                  bg1=await page.locator('#kanbanBody tr[data-task-id="91001"] td').first.evaluate("el=>getComputedStyle(el).backgroundColor")
                  assert bg1 == 'rgb(207, 233, 220)', bg1

                  await page.evaluate("() => document.querySelector('#kanbanBody tr[data-task-id=\"91002\"] td:nth-child(2)').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))")
                  await page.wait_for_function("() => window.bamcoTaskSelection.count('kanban')===2")
                  for task_id in ('91001','91002'):
                      row=page.locator(f'#kanbanBody tr[data-task-id="{task_id}"]')
                      assert await row.evaluate("el=>el.getAttribute('aria-selected')==='true'")
                      bg=await row.locator('td').first.evaluate("el=>getComputedStyle(el).backgroundColor")
                      assert bg == 'rgb(207, 233, 220)', (task_id,bg)

                  print(json.dumps({'selection':'green','multi_select':2,'request_report':'absent','status':'passed'}))
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/check_selection_report.py

# This workflow intentionally validates the deployed GitHub Pages bundle, not only repository source.
