name: Performance report toolbar root fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-report-toolbar-root.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild performance report top command bar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('assets/js/report-stability-fixes-20260911.js')
          s=p.read_text()

          old="""if(window.__bamcoCanonicalReportsLiveSyncV4)return;\nwindow.__bamcoCanonicalReportsLiveSyncV4=true;\nwindow.__bamcoCanonicalReportsLiveSyncV3=true;"""
          new="""if(window.__bamcoCanonicalReportsLiveSyncV5)return;\nwindow.__bamcoCanonicalReportsLiveSyncV5=true;\nwindow.__bamcoCanonicalReportsLiveSyncV4=true;\nwindow.__bamcoCanonicalReportsLiveSyncV3=true;"""
          assert old in s
          s=s.replace(old,new,1)

          hidden=' #performanceReportView>.bamco-page-heading,#performanceReportView>.bamco-management-toolbar{display:none!important}\n'
          assert hidden in s
          s=s.replace(hidden,'',1)

          old_css=' #performanceReportView .canonical-report-tools{display:block!important;margin:0 0 10px!important}\n'
          new_css=' #performanceReportView .canonical-report-tools{margin:0!important}\n'
          assert old_css in s
          s=s.replace(old_css,new_css,1)

          search_css=''' #performanceReportView .performance-search-row{display:flex!important;align-items:center!important;justify-content:flex-start!important;margin-top:2px!important}\n #performanceReportView .performance-search-row input[type=search]{width:min(520px,100%)!important;min-width:260px!important;font-family:"B Nazanin",BNazanin,Tahoma,sans-serif!important;font-weight:400!important}\n'''
          assert search_css in s
          s=s.replace(search_css,'',1)

          old_tools='''function perfTools(range){return `<div class="canonical-report-tools"><div class="performance-command-row"><button type="button" class="ghost" data-performance-home>بازگشت به خانه</button><div class="canonical-date-controls"><label><span>تاریخ شروع</span><span class="canonical-date-field"><input id="canonicalPerfFrom" data-performance-from class="jalali-input" readonly value="${esc(range?.fromText||'')}"><button type="button" class="ghost" data-canonical-date="perf-from" aria-label="انتخاب تاریخ شروع">▦</button></span></label><label><span>تاریخ پایان</span><span class="canonical-date-field"><input id="canonicalPerfTo" data-performance-to class="jalali-input" readonly value="${esc(range?.toText||'')}"><button type="button" class="ghost" data-canonical-date="perf-to" aria-label="انتخاب تاریخ پایان">▦</button></span></label><button type="button" class="ghost" data-canonical-perf-clear data-performance-clear>حذف بازه</button></div><button type="button" class="ghost" data-canonical-refresh="performanceReport">تازه‌سازی</button><button type="button" class="ghost" data-canonical-export="performance">خروجی اکسل فیلترشده</button></div><div class="performance-search-row"><input id="canonicalPerfSearch" type="search" placeholder="جست‌وجو در گزارش…"></div></div>`}'''
          new_tools='''function perfTools(range){return `<div class="workspace-report-tools canonical-report-tools performance-command-row"><div class="canonical-date-controls"><label><span>تاریخ شروع</span><span class="canonical-date-field"><input id="canonicalPerfFrom" data-performance-from class="jalali-input" readonly value="${esc(range?.fromText||'')}"><button type="button" class="ghost" data-canonical-date="perf-from" aria-label="انتخاب تاریخ شروع">▦</button></span></label><label><span>تاریخ پایان</span><span class="canonical-date-field"><input id="canonicalPerfTo" data-performance-to class="jalali-input" readonly value="${esc(range?.toText||'')}"><button type="button" class="ghost" data-canonical-date="perf-to" aria-label="انتخاب تاریخ پایان">▦</button></span></label><button type="button" class="ghost" data-canonical-perf-clear data-performance-clear>حذف بازه</button></div><button type="button" class="ghost" data-canonical-refresh="performanceReport">تازه‌سازی</button><button type="button" class="ghost" data-canonical-export="performance">خروجی اکسل</button></div>`}'''
          assert old_tools in s
          s=s.replace(old_tools,new_tools,1)

          old_render=" if(force||!q('.canonical-report',view))panel(view,'گزارش عملکرد',perfTools(range),'<div class=\"table-wrap\"><table class=\"workspace-table\"><thead></thead><tbody><tr><td class=\"empty\">در حال دریافت اطلاعات…</td></tr></tbody></table></div>');\n"
          new_render=" if(force||!q('.canonical-report',view))panel(view,'گزارش عملکرد',perfTools(range),'<div class=\"table-wrap\"><table class=\"workspace-table\"><thead></thead><tbody><tr><td class=\"empty\">در حال دریافت اطلاعات…</td></tr></tbody></table></div>');window.bamcoInteriorUI?.decorateView?.(view);\n"
          assert old_render in s
          s=s.replace(old_render,new_render,1)

          search_bind=";bindSearch('#canonicalPerfSearch','#performanceReportView');"
          assert search_bind in s
          s=s.replace(search_bind,';',1)

          home_handler="  const home=e.target.closest?.('#performanceReportView [data-performance-home]');if(home){e.preventDefault();e.stopImmediatePropagation();window.bamcoShowHome?.();return}\n"
          assert home_handler in s
          s=s.replace(home_handler,'',1)

          old_tabs="if(tabs.__canonicalReportsV4)return true;tabs.render=(id,...args)=>id==='performanceReport'?renderPerformance(false):id==='responseReport'?renderResponse(false):rawTabRender(id,...args);tabs.__canonicalReportsV4=true;tabs.__canonicalReportsV3=true;return true"
          new_tabs="if(tabs.__canonicalReportsV5)return true;tabs.render=(id,...args)=>id==='performanceReport'?renderPerformance(false):id==='responseReport'?renderResponse(false):rawTabRender(id,...args);tabs.__canonicalReportsV5=true;tabs.__canonicalReportsV4=true;tabs.__canonicalReportsV3=true;return true"
          assert old_tabs in s
          s=s.replace(old_tabs,new_tabs,1)

          old_owner="function markReportOwners(){for(const id of ['performanceReportView','responseReportView']){const view=q('#'+id);if(view)view.dataset.canonicalReportOwner='4'}}"
          new_owner="function markReportOwners(){for(const id of ['performanceReportView','responseReportView']){const view=q('#'+id);if(view)view.dataset.canonicalReportOwner='5'}}"
          assert old_owner in s
          s=s.replace(old_owner,new_owner,1)

          s=s.replace("X.writeFile(wb,(kind==='performance'?'گزارش عملکرد فیلترشده':'گزارش پاسخ‌ها')+'.xlsx'","X.writeFile(wb,(kind==='performance'?'گزارش عملکرد':'گزارش پاسخ‌ها')+'.xlsx'",1)

          assert 'canonicalPerfSearch' not in s
          assert 'data-performance-home' not in s
          assert 'خروجی اکسل فیلترشده' not in s
          assert 'workspace-report-tools canonical-report-tools performance-command-row' in s
          p.write_text(s)

          p=Path('index.html')
          h=p.read_text()
          old='assets/js/report-stability-fixes-20260911.js?v=performance-root-20260912-1'
          new='assets/js/report-stability-fixes-20260911.js?v=performance-toolbar-root-20260912-2'
          assert old in h
          h=h.replace(old,new,1)
          p.write_text(h)
          PY
      - name: Verify canonical ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -q '__bamcoCanonicalReportsLiveSyncV5' assets/js/report-stability-fixes-20260911.js
          grep -q 'workspace-report-tools canonical-report-tools performance-command-row' assets/js/report-stability-fixes-20260911.js
          ! grep -q 'canonicalPerfSearch' assets/js/report-stability-fixes-20260911.js
          ! grep -q 'data-performance-home' assets/js/report-stability-fixes-20260911.js
          ! grep -q 'خروجی اکسل فیلترشده' assets/js/report-stability-fixes-20260911.js
          grep -q 'performance-toolbar-root-20260912-2' index.html
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/report-stability-fixes-20260911.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Move performance report controls into canonical command bar'
            git push
          fi
