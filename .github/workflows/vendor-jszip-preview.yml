name: Vendor JSZip for DOCX preview
on:
  push:
    branches: [refactor/message-waiting-document-preview-20260912]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/message-waiting-document-preview-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Vendor canonical JSZip and wire load order
        run: |
          npm install --no-save jszip@3.10.1
          cp node_modules/jszip/dist/jszip.min.js assets/vendor/jszip.min.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='<script defer src="assets/vendor/docx-preview.min.js?v=0.3.6"></script>'
          if 'assets/vendor/jszip.min.js' not in s:
              if marker not in s: raise SystemExit('docx vendor marker missing')
              s=s.replace(marker,'<script defer src="assets/vendor/jszip.min.js?v=3.10.1"></script>\n  '+marker,1)
          p.write_text(s,encoding='utf-8')
          p=Path('.github/workflows/e2e-browser-preview.yml'); s=p.read_text(encoding='utf-8')
          old='<script src="/assets/vendor/xlsx.min.js"></script><script src="/assets/vendor/docx-preview.min.js"></script>'
          new='<script src="/assets/vendor/xlsx.min.js"></script><script src="/assets/vendor/jszip.min.js"></script><script src="/assets/vendor/docx-preview.min.js"></script>'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/documents-sites.test.cjs'); s=p.read_text(encoding='utf-8')
          s=s.replace("assert.match(src,/role!==\"manager\"/);","assert.match(src,/role\\s*!==\\s*\"manager\"/);")
          s=s.replace("assert.match(src,/await deleteObjects\\(url,service,\\[path\\]\\)\\.catch/);","assert.match(src,/await\\s+deleteObjects\\(url,\\s*service,\\s*\\[path\\]\\)\\.catch/);")
          if "DOCX preview loads local JSZip before docx-preview" not in s:
              s += "\n\ntest('DOCX preview loads local JSZip before docx-preview',()=>{\n  const html=fs.readFileSync(path.join(ROOT,'index.html'),'utf8');\n  const zip=html.indexOf('assets/vendor/jszip.min.js'),docx=html.indexOf('assets/vendor/docx-preview.min.js');\n  assert.ok(zip>=0&&docx>zip);\n  assert.ok(fs.statSync(path.join(ROOT,'assets/vendor/jszip.min.js')).size>10000);\n});\n"
          else:
              s=s.replace("const zip=html.indexOf('assets/vendor/jszip.min.js'),docx=html.indexOf('assets/vendor/docx-preview.min.js'),feature=html.indexOf('assets/js/documents-sites.js');\n  assert.ok(zip>=0&&docx>zip&&feature>docx);","const zip=html.indexOf('assets/vendor/jszip.min.js'),docx=html.indexOf('assets/vendor/docx-preview.min.js');\n  assert.ok(zip>=0&&docx>zip);")
          p.write_text(s,encoding='utf-8')
          PY
          node --check assets/js/documents-sites.js
          node --test tests/documents-sites.test.cjs
          grep -q 'JSZip' assets/vendor/jszip.min.js
          git diff --check
      - name: Commit canonical dependency and remove this runner
        run: |
          git rm .github/workflows/vendor-jszip-preview.yml
          git config user.name 'BAMCO Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/vendor/jszip.min.js tests/documents-sites.test.cjs .github/workflows/e2e-browser-preview.yml
          git commit -m 'Add local JSZip dependency for DOCX preview'
          git push origin HEAD:refactor/message-waiting-document-preview-20260912
