name: Task table filter live v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task-table-filter-live-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for repaired production source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 40); do
            html="$(curl -fsSL --connect-timeout 10 "${BASE}?filter-v2=${GITHUB_SHA}-${i}" || true)"
            app="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/app.js?filter-v2=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'app.js?v=task-filter-repair-20260912-2' <<<"$html" \
              && test "$(grep -o 'count=archived?15:13' <<<"$app" | wc -l)" -ge 2 \
              && ! grep -q 'count=archived?15:14' <<<"$app"; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify Kanban and archive columns filters and selection
        shell: bash
        run: |
          cat > /tmp/check.py <<'PY'
          import asyncio,re,json
          from playwright.async_api import async_playwright
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          def green(v):
              m=re.match(r'rgba?\((\d+),\s*(\d+),\s*(\d+)',v or '')
              if not m:return False
              r,g,b=map(int,m.groups());return g>r and g>b and g-r>=15
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1440,'height':900})
                  errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                  await page.goto(BASE+'?filter-v2-live=1',wait_until='networkidle')
                  await page.wait_for_function("typeof renderTasks==='function' && window.__bamcoTaskBulkDelete20260912V4===true")
                  assert await page.locator('script[src*="task-terminal-columns-20260912.js"]').count()==0
                  assert await page.locator('#kanbanView thead tr').first.locator('th').count()==13
                  assert await page.locator('#archiveView thead tr').first.locator('th').count()==15
                  assert (await page.locator('#kanbanView thead tr').first.locator('th').last.text_content()).strip()=='توضیحات مدیر'
                  assert (await page.locator('#archiveView thead tr').first.locator('th').last.text_content()).strip()=='تعجیل'
                  await page.evaluate("""() => {
                    state.profile={id:'00000000-0000-0000-0000-000000000001',role:'manager',active:true,full_name:'مدیر'};
                    state.profiles=[state.profile];
                    state.tasks=[
                      {id:99101,legacy_id:1,title:'کانبان',description:'الف',owner_id:state.profile.id,status:'ثبت شده',priority:'متوسط',reminder_days:0,due_state:'',manager_notes:'یادداشت',archived:false},
                      {id:99102,legacy_id:2,title:'آرشیو',description:'ب',owner_id:state.profile.id,status:'انجام شده',priority:'فوری',reminder_days:0,due_state:'',manager_notes:'آرشیو',archived:true,delay_days:2,advance_days:4}
                    ];state.selected={kanban:null,archive:null};renderTasks(false);renderTasks(true);
                  }""")
                  await page.wait_for_timeout(250)
                  out={
                    'k_filters':await page.locator('#kanbanView .column-filters select').count(),
                    'a_filters':await page.locator('#archiveView .column-filters select').count(),
                    'k_cells':await page.locator('#kanbanBody tr[data-task-id="99101"] td').count(),
                    'a_cells':await page.locator('#archiveBody tr[data-task-id="99102"] td').count()
                  }
                  assert out=={'k_filters':13,'a_filters':15,'k_cells':13,'a_cells':15},out
                  assert (await page.locator('#kanbanBody tr[data-task-id="99101"] td').last.text_content()).strip()=='یادداشت'
                  assert (await page.locator('#archiveBody tr[data-task-id="99102"] td').last.text_content()).strip()=='۴'
                  await page.evaluate("() => document.querySelector('#kanbanBody tr[data-task-id=\"99101\"] td:nth-child(2)').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))")
                  await page.wait_for_function("() => window.bamcoTaskSelection.count('kanban')===1")
                  bg=await page.locator('#kanbanBody tr[data-task-id="99101"] td').first.evaluate('el=>getComputedStyle(el).backgroundColor')
                  assert green(bg),bg
                  assert not errors,errors
                  print(json.dumps({**out,'kanban_last':'توضیحات مدیر','archive_last':'تعجیل','selection':'green','status':'passed'},ensure_ascii=False))
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/check.py
