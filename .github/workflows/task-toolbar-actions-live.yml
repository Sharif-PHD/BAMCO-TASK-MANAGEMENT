name: Task toolbar actions live regression

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/task-toolbar-actions-20260912.js'
      - 'assets/js/avatar-final-20260911.js'
      - 'index.html'
      - '.github/workflows/task-toolbar-actions-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for deployed toolbar action runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 30); do
            html="$(curl -fsSL --connect-timeout 10 "${BASE}?task-actions=${GITHUB_SHA}-${i}" || true)"
            loader="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/avatar-final-20260911.js?task-actions=${GITHUB_SHA}-${i}" || true)"
            actions="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/task-toolbar-actions-20260912.js?task-actions=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'avatar-final-20260911.js?v=task-toolbar-actions-20260912-1' <<<"$html" \
              && grep -q 'task-toolbar-actions-20260912.js?v=20260912-1' <<<"$loader" \
              && grep -q '__bamcoTaskToolbarActions20260912V1' <<<"$actions"; then
              ready=1; break
            fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify Kanban and archive toolbar actions
        shell: bash
        run: |
          cat > /tmp/check_task_actions.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1500,'height':900})
                  await page.goto(BASE+'?task-actions-live=1',wait_until='networkidle')
                  await page.wait_for_function("window.__bamcoTaskBulkDelete20260912V6===true && window.__bamcoTaskToolbarActions20260912V1===true && window.bamcoTaskSelection && window.bamcoTaskToolbarActions")
                  await page.evaluate("""() => {
                    document.body.classList.remove('department-pending');
                    document.querySelector('#departmentEntry')?.setAttribute('hidden','');
                    document.querySelector('#loginView')?.classList.add('hidden');
                    document.querySelector('#appView')?.classList.remove('hidden');
                    state.profile={id:1,role:'manager',active:true,full_name:'مدیر'};
                    state.profiles=[{id:1,full_name:'مدیر'}];
                    state.selected={kanban:null,archive:null};
                    state.tasks=[
                      {id:701,legacy_id:1,title:'کانبان تست',owner_id:1,status:'ثبت شده',priority:'متوسط',archived:false},
                      {id:702,legacy_id:2,title:'آرشیو تست',owner_id:1,status:'انجام شده',priority:'متوسط',archived:true,start_date:'2026-09-01',due_date:'2026-09-10'}
                    ];
                    document.querySelector('#kanbanBody').innerHTML='<tr data-task-id="701" data-scope="kanban"><td>1</td><td>کانبان تست</td></tr>';
                    document.querySelector('#archiveBody').innerHTML='<tr data-task-id="702" data-scope="archive"><td>2</td><td>آرشیو تست</td></tr>';
                    window.__taskActionCalls=[];
                    window.openTask=t=>window.__taskActionCalls.push(['edit',Number(t.id)]);
                    window.archiveTask=async id=>window.__taskActionCalls.push(['archive',Number(id)]);
                    window.restoreTask=async id=>window.__taskActionCalls.push(['restore',Number(id)]);
                    window.bamcoNotice=()=>{};
                    window.bamcoTaskToolbarActions.sync();
                  }""")
                  await page.evaluate("document.querySelector('#kanbanBody tr').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))")
                  await page.wait_for_function("window.bamcoTaskSelection.count('kanban')===1 && !document.querySelector('#kanbanEditBtn').disabled && !document.querySelector('#kanbanArchiveBtn').disabled && !document.querySelector('#kanbanDeleteBtn').disabled")
                  await page.evaluate("document.querySelector('#kanbanEditBtn').click()")
                  await page.wait_for_timeout(20)
                  await page.evaluate("document.querySelector('#kanbanArchiveBtn').click()")
                  await page.wait_for_function("window.__taskActionCalls.some(x=>x[0]==='edit'&&x[1]===701) && window.__taskActionCalls.some(x=>x[0]==='archive'&&x[1]===701)")

                  await page.evaluate("document.querySelector('#archiveBody tr').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))")
                  await page.wait_for_function("window.bamcoTaskSelection.count('archive')===1 && !document.querySelector('#archiveEditBtn').disabled && !document.querySelector('#archiveRestoreBtn').disabled && !document.querySelector('#archiveDeleteBtn').disabled")
                  await page.evaluate("document.querySelector('#archiveEditBtn').click()")
                  await page.wait_for_timeout(20)
                  await page.evaluate("document.querySelector('#archiveRestoreBtn').click()")
                  await page.wait_for_function("window.__taskActionCalls.some(x=>x[0]==='edit'&&x[1]===702) && window.__taskActionCalls.some(x=>x[0]==='restore'&&x[1]===702)")

                  result=await page.evaluate("""() => ({
                    kanbanSelection:window.bamcoTaskSelection.count('kanban'),
                    archiveSelection:window.bamcoTaskSelection.count('archive'),
                    calls:window.__taskActionCalls,
                    buttons:{
                      kanbanEdit:!document.querySelector('#kanbanEditBtn').disabled,
                      kanbanArchive:!document.querySelector('#kanbanArchiveBtn').disabled,
                      kanbanDelete:!document.querySelector('#kanbanDeleteBtn').disabled,
                      archiveEdit:!document.querySelector('#archiveEditBtn').disabled,
                      archiveRestore:!document.querySelector('#archiveRestoreBtn').disabled,
                      archiveDelete:!document.querySelector('#archiveDeleteBtn').disabled
                    },
                    status:'passed'
                  })""")
                  print(json.dumps(result,ensure_ascii=False))
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/check_task_actions.py
