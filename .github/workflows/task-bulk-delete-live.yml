name: Task bulk delete live regression

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/task-bulk-delete-20260912.js'
      - 'assets/js/avatar-final-20260911.js'
      - '.github/workflows/task-bulk-delete-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 24); do
            loader="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/avatar-final-20260911.js?v=20260911-1&probe=${GITHUB_SHA}-${i}" || true)"
            bulk="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/task-bulk-delete-20260912.js?probe=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'task-bulk-delete-20260912.js' <<<"$loader" && grep -q '__bamcoTaskBulkDelete20260912V1' <<<"$bulk"; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify Kanban and archive multi-delete in live app
        shell: bash
        run: |
          cat > /tmp/check_bulk_delete.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          def task(i, legacy, archived):
              return {
                  'id': i, 'legacy_id': legacy, 'title': f'Task {legacy}', 'description':'',
                  'owner_id': 1, 'status':'ثبت شده', 'priority':'متوسط', 'start_date':None,
                  'done_date':None, 'due_date':None, 'reminder_days':0,
                  'updated_at':'2026-09-11T12:00:00Z', 'due_state':'', 'manager_notes':'',
                  'archived': archived
              }

          async def run_scope(browser, scope):
              archived = scope == 'archive'
              base_id = 200 if archived else 100
              initial=[task(base_id+i, i, archived) for i in range(1,5)]
              delete_ids=[base_id+1, base_id+3]
              remaining=[task(base_id+2,1,archived),task(base_id+4,2,archived)]
              calls=[]
              page=await browser.new_page(viewport={'width':1365,'height':900})

              async def route_api(route, request):
                  url=request.url
                  if '/rest/v1/rpc/delete_tasks_and_resequence' in url:
                      calls.append(json.loads(request.post_data or '{}'))
                      await route.fulfill(status=200, content_type='application/json', body='2')
                  elif '/rest/v1/task_status_view' in url:
                      await route.fulfill(status=200, content_type='application/json', body=json.dumps(remaining,ensure_ascii=False))
                  elif 'supabase.co/rest/v1/' in url or 'supabase.co/auth/v1/' in url:
                      await route.fulfill(status=200, content_type='application/json', body='[]')
                  else:
                      await route.continue_()
              await page.route('**/*', route_api)
              await page.goto(BASE+f'?bulk-delete-live={scope}', wait_until='networkidle')
              await page.wait_for_function('window.__bamcoTaskBulkDelete20260912V1 === true')
              await page.evaluate("""rows => {
                  state.profile={id:1,role:'manager',active:true,full_name:'مدیر'};
                  state.profiles=[{id:1,full_name:'مدیر'}];
                  state.tasks=rows;
                  state.selected={kanban:null,archive:null};
                  window.bamcoNotice=()=>{};
                  window.bamcoConfirm=async()=>true;
                  renderTasks(false);renderTasks(true);
              }""", initial)
              body='#archiveBody' if archived else '#kanbanBody'
              delete='#archiveDeleteBtn' if archived else '#kanbanDeleteBtn'
              await page.wait_for_function("sel => [...document.querySelectorAll(sel+' input.task-pick')].length===4 && [...document.querySelectorAll(sel+' input.task-pick')].every(x=>x.type==='checkbox')", body)
              rows=page.locator(f'{body} tr[data-task-id]')
              await rows.nth(0).click()
              await rows.nth(2).click()
              await page.wait_for_function("sel => window.bamcoTaskSelection.ids(sel).length===2", scope)
              assert await page.locator(delete).is_enabled(), f'{scope} delete button remained disabled'
              await page.locator(delete).click()
              await page.wait_for_function('() => state.tasks.length===2 && state.tasks.map(x=>Number(x.legacy_id)).sort((a,b)=>a-b).join(",")==="1,2"')
              assert len(calls)==1, f'{scope}: expected one RPC, got {len(calls)}'
              sent=sorted(int(x) for x in calls[0].get('p_task_ids',[]))
              assert sent==sorted(delete_ids), f'{scope}: wrong ids {sent} != {delete_ids}'
              assert await page.evaluate("scope => window.bamcoTaskSelection.count(scope)", scope)==0
              print(json.dumps({'scope':scope,'rpc_ids':sent,'remaining_legacy_ids':[1,2],'status':'passed'}))
              await page.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  await run_scope(browser,'kanban')
                  await run_scope(browser,'archive')
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/check_bulk_delete.py
