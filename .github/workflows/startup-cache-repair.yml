name: One-time final avatar renderer repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-cache-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load final avatar renderer safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          addition='<script defer src="assets/js/avatar-final-20260911.js?v=20260911-1"></script>'
          if addition not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('body close marker not found')
              s=s.replace(marker,addition+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          assert '\ufffd' not in check
          assert addition in check
          print('UTF-8 and final avatar renderer: PASS')
          PY
      - name: Commit cache repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load final persistent avatar renderer'
          git push origin HEAD:main
