name: One-time startup cache repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-cache-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump startup asset URLs safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'assets/js/department-entry.js?v=mobile-entry-20260911-2':'assets/js/department-entry.js?v=mobile-entry-20260911-3',
            'assets/js/table-selection.js?v=details-20260910-1':'assets/js/table-selection.js?v=startup-stable-20260911-1',
            'assets/js/runtime-fixes-20260911.js?v=20260911-2':'assets/js/runtime-fixes-20260911.js?v=20260911-3',
            'assets/js/dashboard-response-fixes-20260911.js?v=20260911-3':'assets/js/dashboard-response-fixes-20260911.js?v=20260911-4',
            'assets/js/admin-root-fixes-20260911.js?v=20260911-4':'assets/js/admin-root-fixes-20260911.js?v=20260911-5',
            'assets/js/report-root-fixes-20260911.js?v=20260911-1':'assets/js/report-root-fixes-20260911.js?v=20260911-2',
          }
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new)
              elif new not in s:
                  raise SystemExit(f'missing both old and new startup URL: {old}')
          p.write_text(s,encoding='utf-8')
          p.read_text(encoding='utf-8')
          assert '\ufffd' not in s
          print('UTF-8 and startup URLs: PASS')
          PY
      - name: Commit cache repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force fresh startup assets'
          git push origin HEAD:main
