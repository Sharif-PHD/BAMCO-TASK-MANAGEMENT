name: One-time unified messaging cache repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-cache-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load unified messaging assets safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'assets/js/message-renderer.js?v=details-20260910-1':'assets/js/message-renderer.js?v=message-unified-20260911-1',
            'assets/js/phase2-message-engine.js?v=details-20260910-1':'assets/js/phase2-message-engine.js?v=message-unified-20260911-1',
            'assets/js/templates.js?v=template-root-20260911-5':'assets/js/templates.js?v=template-root-20260911-6',
            'assets/js/report-stability-fixes-20260911.js?v=20260911-2':'assets/js/report-stability-fixes-20260911.js?v=20260911-3',
          }
          for old,new in replacements.items():
              if old in s: s=s.replace(old,new)
              elif new not in s: raise SystemExit(f'missing asset URL: {old}')
          tag='<script defer src="assets/js/messaging-history-root-20260911.js?v=20260911-1"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('missing body close')
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          assert '\ufffd' not in check
          for v in replacements.values(): assert v in check
          assert tag in check
          print('UTF-8 and unified messaging loaders: PASS')
          PY
      - name: Commit cache repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load unified messaging and history assets'
          git push origin HEAD:main
