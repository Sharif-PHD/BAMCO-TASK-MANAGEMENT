name: One-time report stability cache repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-cache-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load report stability fix safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script defer src="assets/js/report-stability-fixes-20260911.js?v=20260911-1"></script>'
          new='<script defer src="assets/js/report-stability-fixes-20260911.js?v=20260911-2"></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              if '</body>' not in s:
                  raise SystemExit('missing body close')
              s=s.replace('</body>',new+'\n</body>')
          p.write_text(s,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          assert '\ufffd' not in check and new in check
          print('UTF-8 and report stability loader: PASS')
          PY
      - name: Commit cache repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump report stability asset version'
          git push origin HEAD:main
