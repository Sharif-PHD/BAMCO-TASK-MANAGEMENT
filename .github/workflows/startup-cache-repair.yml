name: One-time final messaging cache repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-cache-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load final messaging assets safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('assets/js/messaging-history-root-20260911.js?v=20260911-1','assets/js/messaging-history-root-20260911.js?v=20260911-2'),
            ('assets/js/templates.js?v=template-root-20260911-6','assets/js/templates.js?v=template-root-20260911-7'),
          ]
          for old,new in pairs:
              if old in s: s=s.replace(old,new)
              elif new not in s: raise SystemExit('missing asset: '+old)
          p.write_text(s,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          assert '\ufffd' not in check
          for _,new in pairs: assert new in check
          print('UTF-8 and final messaging assets: PASS')
          PY
      - name: Commit cache repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump final messaging assets'
          git push origin HEAD:main
