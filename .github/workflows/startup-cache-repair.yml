name: One-time self-healing home cache repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-cache-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force fresh self-healing home script safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='assets/js/card-home.js?v=welcome-home-20260911-1'
          new='assets/js/card-home.js?v=welcome-home-20260911-2'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('card-home asset reference not found')
          p.write_text(s,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          assert '\ufffd' not in check
          assert new in check
          print('UTF-8 and self-healing home cache bust: PASS')
          PY
      - name: Commit cache repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force fresh self-healing home workspace script'
          git push origin HEAD:main
