name: One-time workload segment label repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-cache-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load reference workload segment labels safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script defer src="assets/js/login-avatar-workload-fix-20260911.js?v=20260911-1"></script>'
          addition='<script defer src="assets/js/workload-segment-labels-20260911.js?v=20260911-1"></script>'
          if addition not in s:
              if marker not in s:
                  raise SystemExit('avatar/workload fix marker not found')
              s=s.replace(marker, marker+'\n'+addition, 1)
          p.write_text(s,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          assert '\ufffd' not in check
          assert addition in check
          print('UTF-8 and reference workload segment labels: PASS')
          PY
      - name: Commit cache repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load reference workload segment labels'
          git push origin HEAD:main
