name: Root task table fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-task-table-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch task tables at source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {n}')
              p.write_text(s.replace(old,new,1))

          # index.html: source markup itself must end in تعجیل, not a runtime patch.
          replace_once('index.html',
              '<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>انتخاب</th></tr><tr class="column-filters">',
              '<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>تعجیل</th></tr><tr class="column-filters">',
              'kanban header')
          replace_once('index.html',
              '<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>تأخیر</th><th>تعجیل</th><th>انتخاب</th></tr><tr class="column-filters">',
              '<th>وضعیت دیرکرد</th><th>توضیحات مدیر</th><th>تأخیر</th><th>تعجیل</th></tr><tr class="column-filters">',
              'archive header')
          replace_once('index.html',
              'assets/js/app.js?v=profile-counts-20260911-1',
              'assets/js/app.js?v=task-table-root-20260912-1',
              'app cache buster')
          replace_once('index.html',
              'assets/js/avatar-final-20260911.js?v=20260911-1',
              'assets/js/avatar-final-20260911.js?v=task-table-root-20260912-1',
              'late loader cache buster')

          # app.js: render correct columns natively, with no selection column/cell.
          replace_once('assets/js/app.js',
              'colspan="${archived?16:14}"',
              'colspan="${archived?15:14}"',
              'empty row colspan')
          replace_once('assets/js/app.js',
              '''    const selected=String(state.selected[scope])===String(t.id),pick=`<td class="fa-text"><input class="task-pick" type="radio" name="${scope}Task" value="${t.id}" ${selected?'checked':''} aria-label="انتخاب وظیفه ${safe(displayId(t))}"></td>`;\n    if(archived)return `<tr class="${rowClass} ${selected?'task-selected':''}" data-task-id="${t.id}" data-scope="archive">${common}${cell(fa(t.delay_days||0))}${cell(fa(t.advance_days||0))}${pick}</tr>`;\n    return `<tr class="${rowClass} ${selected?'task-selected':''}" data-task-id="${t.id}" data-scope="kanban">${common}${pick}</tr>`}).join('');''',
              '''    const selected=String(state.selected[scope])===String(t.id);\n    if(archived)return `<tr class="${rowClass} ${selected?'task-selected':''}" data-task-id="${t.id}" data-scope="archive">${common}${cell(fa(t.delay_days||0))}${cell(fa(t.advance_days||0))}</tr>`;\n    return `<tr class="${rowClass} ${selected?'task-selected':''}" data-task-id="${t.id}" data-scope="kanban">${common}${cell(fa(t.advance_days||0))}</tr>`}).join('');''',
              'native task row rendering')
          replace_once('assets/js/app.js',
              "return archived?[...base,fa(t.delay_days||0),fa(t.advance_days||0),'']: [...base,'']",
              "return archived?[...base,fa(t.delay_days||0),fa(t.advance_days||0)]:[...base,fa(t.advance_days||0)]",
              'task column values')
          replace_once('assets/js/app.js',
              'count=archived?15:13;',
              'count=archived?15:14;',
              'column filter count')

          # Bulk selection must be row-driven. No checkbox/radio or select-all dependency.
          bulk=Path('assets/js/task-bulk-delete-20260912.js')
          s=bulk.read_text()
          s=s.replace('if(window.__bamcoTaskBulkDelete20260912V3)return;\nwindow.__bamcoTaskBulkDelete20260912V3=true;',
                      'if(window.__bamcoTaskBulkDelete20260912V4)return;\nwindow.__bamcoTaskBulkDelete20260912V4=true;\nwindow.__bamcoTaskBulkDelete20260912V3=true;',1)
          old='''function ensureHeaderToggle(scope){\n  const th=q(`${config[scope].view} table thead tr:first-child th:last-child`);if(!th)return null;\n  let input=q('[data-bamco-task-select-all]',th);if(input)return input;\n  const label=document.createElement('label');label.className='task-select-all';label.style.cssText='display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;cursor:pointer';\n  input=document.createElement('input');input.type='checkbox';input.dataset.bamcoTaskSelectAll=scope;input.setAttribute('aria-label',scope==='archive'?'انتخاب همه ردیف‌های قابل مشاهده آرشیو':'انتخاب همه ردیف‌های قابل مشاهده کانبان');\n  const text=document.createElement('span');text.textContent='انتخاب همه';label.append(input,text);th.replaceChildren(label);return input;\n}\n'''
          new='''function removeLegacySelectAll(){\n  qa('[data-bamco-task-select-all]').forEach(input=>{const label=input.closest('label');if(label)label.remove();else input.remove()});\n}\n'''
          if s.count(old)!=1: raise SystemExit(f'bulk select-all function: {s.count(old)} matches')
          s=s.replace(old,new,1)
          old="""  const visible=visibleIds(scope),all=ensureHeaderToggle(scope);\n  if(all){const selectedVisible=visible.filter(id=>picked[scope].has(id)).length;all.checked=visible.length>0&&selectedVisible===visible.length;all.indeterminate=selectedVisible>0&&selectedVisible<visible.length;all.disabled=visible.length===0}\n"""
          if s.count(old)!=1: raise SystemExit(f'bulk toolbar select-all block: {s.count(old)} matches')
          s=s.replace(old,"  removeLegacySelectAll();\n",1)
          old="""    const id=String(row.dataset.taskId),input=q('input.task-pick',row);if(!input)return;\n    if(input.type!=='checkbox')input.type='checkbox';input.removeAttribute('name');\n    const selected=picked[scope].has(id);\n    input.checked=selected;input.setAttribute('aria-checked',selected?'true':'false');\n    row.classList.toggle('task-selected',selected);row.setAttribute('aria-selected',selected?'true':'false');row.dataset.bamcoSelected=selected?'1':'0';\n"""
          new="""    const id=String(row.dataset.taskId),input=q('input.task-pick',row),selected=picked[scope].has(id);\n    if(input){input.checked=selected;input.setAttribute('aria-checked',selected?'true':'false');input.style.setProperty('display','none','important');input.setAttribute('aria-hidden','true')}\n    row.classList.toggle('task-selected',selected);row.setAttribute('aria-selected',selected?'true':'false');row.dataset.bamcoSelected=selected?'1':'0';\n"""
          if s.count(old)!=1: raise SystemExit(f'bulk decorate block: {s.count(old)} matches')
          s=s.replace(old,new,1)
          s=s.replace("  ensureStyles();purgeRequestReport();", "  ensureStyles();removeLegacySelectAll();purgeRequestReport();",1)
          bulk.write_text(s)

          # Ensure old browsers fetch the new row-driven selector.
          av=Path('assets/js/avatar-final-20260911.js'); a=av.read_text()
          if 'task-bulk-delete-20260912.js?v=20260912-3' not in a: raise SystemExit('avatar bulk cache string missing')
          a=a.replace('task-bulk-delete-20260912.js?v=20260912-3','task-bulk-delete-20260912.js?v=20260912-4',1)
          av.write_text(a)
          PY
      - name: Verify root source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<th>توضیحات مدیر</th><th>تعجیل</th></tr>' index.html
          grep -q '<th>تأخیر</th><th>تعجیل</th></tr>' index.html
          ! grep -q '<th>انتخاب</th>' index.html
          ! grep -q 'data-bamco-task-select-all' assets/js/app.js
          grep -q 'task-table-root-20260912-1' index.html
          grep -q '__bamcoTaskBulkDelete20260912V4' assets/js/task-bulk-delete-20260912.js
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/js/app.js assets/js/task-bulk-delete-20260912.js assets/js/avatar-final-20260911.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix task table columns and row selection at source'
          git push
