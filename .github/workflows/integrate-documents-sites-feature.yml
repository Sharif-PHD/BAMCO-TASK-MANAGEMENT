name: Integrate documents and sites feature
on:
  push:
    branches: [documents-sites-feature-20260912]
permissions:
  contents: write
jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: documents-sites-feature-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate feature into index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'assets/css/documents-sites.css' not in s:
              marker='  <link rel="stylesheet" href="assets/css/app.css?v=mobile-shell-20260911-1">'
              assert marker in s
              s=s.replace(marker, marker+'\n  <link rel="stylesheet" href="assets/css/documents-sites.css?v=documents-sites-20260912-1">',1)
          if 'data-view="documents"' not in s:
              marker='        <button data-view="requestHistory" id="requestHistoryNav"><b>◷</b><span>سوابق درخواست‌ها</span></button>'
              assert marker in s
              addition='''\n        <button data-view="documents" id="documentsNav"><b>▧</b><span>فرم‌ها و مستندات</span></button>\n        <button data-view="sitesAccess" id="sitesAccessNav"><b>⌁</b><span>سایت‌ها و دسترسی‌ها</span></button>'''
              s=s.replace(marker,marker+addition,1)
          if 'id="documentsView"' not in s:
              marker='      <section id="vehiclePermanentView"'
              assert marker in s
              sections='''      <section id="documentsView" class="view hidden">\n        <div class="feature-toolbar"><div><h3>فرم‌ها و مستندات</h3><p>کتابخانه امن فایل‌های سازمانی</p></div><div class="feature-toolbar-actions"><input id="documentsSearch" type="search" placeholder="جست‌وجو در مستندات…"><button id="documentsRefresh" class="ghost">تازه‌سازی</button><button id="addDocumentCategory" class="primary hidden">دسته‌بندی جدید</button></div></div>\n        <div id="documentsFeatureBody"></div>\n      </section>\n      <section id="sitesAccessView" class="view hidden">\n        <div class="feature-toolbar"><div><h3>سایت‌ها و دسترسی‌ها</h3><p>دسترسی امن به سامانه‌ها و سایت‌های کاری</p></div><div class="feature-toolbar-actions"><input id="sitesSearch" type="search" placeholder="جست‌وجو در سایت‌ها…"><select id="sitesFilter"><option value="all">همه</option><option value="organization">سایت‌های سازمانی</option><option value="personal">سایت‌های شخصی</option></select><button id="sitesRefresh" class="ghost">تازه‌سازی</button><button id="addPersonalSite" class="primary">سایت شخصی جدید</button><button id="addOrganizationSite" class="primary hidden">سایت سازمانی جدید</button><button id="sitesExcel" class="ghost">خروجی اکسل</button><button id="sitesManagerExcel" class="danger hidden">خروجی محرمانه دسترسی‌ها</button></div></div>\n        <div class="feature-confidential-note">رمز عبور فقط با درخواست صریح شما از سرور امن دریافت می‌شود و به‌صورت پیش‌فرض نمایش داده نمی‌شود.</div>\n        <div id="sitesFeatureBody"></div>\n      </section>\n\n'''
              s=s.replace(marker,sections+marker,1)
          if 'assets/js/documents-sites.js' not in s:
              marker='</body>'
              assert marker in s
              s=s.replace(marker,'  <script defer src="assets/js/documents-sites.js?v=documents-sites-20260912-1"></script>\n'+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Remove temporary integration workflow
        run: rm .github/workflows/integrate-documents-sites-feature.yml
      - name: JavaScript syntax
        run: node --check assets/js/documents-sites.js
      - name: Install test dependencies
        run: npm ci
      - name: Focused feature tests
        run: node --test tests/documents-sites.test.cjs
      - name: Commit integrated feature
        run: |
          git config user.name "BAMCO Feature Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/js/documents-sites.js assets/css/documents-sites.css tests/documents-sites.test.cjs supabase/migrations supabase/functions
          git add -u .github/workflows/integrate-documents-sites-feature.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate documents library and secure site access"
          git push origin HEAD:documents-sites-feature-20260912
