name: Task toolbar real flow live regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task-toolbar-actions-flow-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for deployed action runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 30); do
            html="$(curl -fsSL --connect-timeout 10 "${BASE}?task-flow=${GITHUB_SHA}-${i}" || true)"
            actions="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/task-toolbar-actions-20260912.js?task-flow=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'avatar-final-20260911.js?v=task-toolbar-actions-20260912-1' <<<"$html" && grep -q '__bamcoTaskToolbarActions20260912V1' <<<"$actions"; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise edit archive and restore through real handlers
        shell: bash
        run: |
          cat > /tmp/check_task_flows.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1500,'height':900})
                  calls={'patch':[],'restore':[]}

                  async def route_api(route, request):
                      url=request.url
                      if '/rest/v1/tasks?' in url and request.method=='PATCH':
                          calls['patch'].append({'url':url,'body':json.loads(request.post_data or '{}')})
                          await route.fulfill(status=200,content_type='application/json',body='[{}]')
                      elif '/rest/v1/rpc/restore_tasks_to_kanban_and_resequence' in url:
                          calls['restore'].append(json.loads(request.post_data or '{}'))
                          await route.fulfill(status=200,content_type='application/json',body='1')
                      elif '/rest/v1/task_status_view' in url:
                          await route.fulfill(status=200,content_type='application/json',body='[]')
                      elif '/rest/v1/profiles' in url:
                          await route.fulfill(status=200,content_type='application/json',body='[{"id":1,"full_name":"مدیر","role":"manager","active":true}]')
                      elif '/rest/v1/change_requests' in url or '/rest/v1/rpc/request_routing_status' in url:
                          await route.fulfill(status=200,content_type='application/json',body='[]')
                      elif 'supabase.co/rest/v1/' in url or 'supabase.co/auth/v1/' in url:
                          await route.fulfill(status=200,content_type='application/json',body='[]')
                      else:
                          await route.continue_()

                  await page.route('**/*',route_api)
                  await page.goto(BASE+'?task-real-flow=1',wait_until='networkidle')
                  await page.wait_for_function("window.__bamcoTaskToolbarActions20260912V1===true && window.bamcoTaskSelection && window.bamcoTaskToolbarActions")
                  await page.evaluate("""() => {
                    document.body.classList.remove('department-pending');
                    document.querySelector('#departmentEntry')?.setAttribute('hidden','');
                    document.querySelector('#loginView')?.classList.add('hidden');
                    document.querySelector('#appView')?.classList.remove('hidden');
                    state.profile={id:1,role:'manager',active:true,full_name:'مدیر'};
                    state.user={id:1};state.profiles=[state.profile];state.selected={kanban:null,archive:null};
                    window.bamcoNotice=()=>{};window.bamcoConfirm=async()=>true;
                    if(window.bamcoOptions){
                      window.bamcoOptions.status=()=>({archivable:true});
                      window.bamcoOptions.completed=()=>false;
                      window.bamcoOptions.label=(type,key)=>key==='done'?'انجام شده':key==='doing'?'در حال انجام':key;
                      window.bamcoOptions.load=async()=>{};
                    }
                    state.tasks=[{id:801,legacy_id:1,title:'کار کانبان واقعی',description:'تست',owner_id:1,status:'ثبت شده',priority:'متوسط',archived:false,start_date:'2026-09-01',due_date:'2026-09-10',done_date:null,reminder_days:0}];
                    document.querySelector('#kanbanBody').innerHTML='<tr data-task-id="801" data-scope="kanban"><td>۱</td><td>کار کانبان واقعی</td></tr>';
                    window.bamcoTaskToolbarActions.sync();
                  }""")
                  await page.evaluate("document.querySelector('#kanbanBody tr').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))")
                  await page.wait_for_function("!document.querySelector('#kanbanEditBtn').disabled && !document.querySelector('#kanbanArchiveBtn').disabled")
                  await page.evaluate("document.querySelector('#kanbanEditBtn').click()")
                  await page.wait_for_function("document.querySelector('#taskDialog')?.open===true && Number(state.editing?.id)===801")
                  await page.evaluate("document.querySelector('#taskDialog').close()")
                  await page.evaluate("document.querySelector('#kanbanArchiveBtn').click()")
                  for _ in range(100):
                      if calls['patch']: break
                      await page.wait_for_timeout(20)
                  assert len(calls['patch'])==1,calls
                  assert calls['patch'][0]['body'].get('archived') is True,calls
                  assert 'id=eq.801' in calls['patch'][0]['url'],calls

                  await page.evaluate("""() => {
                    state.tasks=[{id:802,legacy_id:2,title:'کار آرشیو واقعی',description:'تست',owner_id:1,status:'انجام شده',priority:'متوسط',archived:true,start_date:'2026-09-01',due_date:'2026-09-10',done_date:'2026-09-10',reminder_days:0}];
                    state.selected.archive=null;
                    window.bamcoTaskSelection.clear('archive');
                    document.querySelector('#archiveBody').innerHTML='<tr data-task-id="802" data-scope="archive"><td>۲</td><td>کار آرشیو واقعی</td></tr>';
                    window.bamcoTaskToolbarActions.sync();
                  }""")
                  await page.evaluate("document.querySelector('#archiveBody tr').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))")
                  await page.wait_for_function("!document.querySelector('#archiveEditBtn').disabled && !document.querySelector('#archiveRestoreBtn').disabled && !document.querySelector('#archiveDeleteBtn').disabled")
                  await page.evaluate("document.querySelector('#archiveEditBtn').click()")
                  await page.wait_for_function("document.querySelector('#taskDialog')?.open===true && Number(state.editing?.id)===802")
                  await page.evaluate("document.querySelector('#taskDialog').close()")
                  await page.evaluate("document.querySelector('#archiveRestoreBtn').click()")
                  for _ in range(100):
                      if calls['restore']: break
                      await page.wait_for_timeout(20)
                  assert calls['restore']==[{'p_task_ids':[802]}],calls

                  print(json.dumps({'edit_kanban':'dialog-opened','archive_patch':calls['patch'][0]['body'],'edit_archive':'dialog-opened','restore_rpc':calls['restore'][0],'status':'passed'},ensure_ascii=False))
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/check_task_flows.py
