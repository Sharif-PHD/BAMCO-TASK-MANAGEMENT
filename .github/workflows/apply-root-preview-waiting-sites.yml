name: Root preview waiting sites gate
on:
  push:
    branches: [fix/root-preview-waiting-sites-20260912]
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/root-preview-waiting-sites-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical root fixes
        run: node .github/scripts/apply_root_preview_waiting_sites.cjs
      - name: Syntax checks
        run: |
          node --check assets/js/documents-sites.js
          node --check assets/js/card-home.js
      - name: Feature regressions
        run: node --test tests/documents-sites.test.cjs tests/home-layout.test.cjs
      - name: Validate clean product diff
        run: |
          git diff --check
          test -z "$(git status --porcelain | grep -E '^.. assets/js/apply-|^.. assets/js/.*fix-preview' || true)"
      - name: Commit only validated canonical changes
        run: |
          rm -f .github/scripts/apply_root_preview_waiting_sites.cjs .github/workflows/apply-root-preview-waiting-sites.yml
          git config user.name "BAMCO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix signed PDF preview, waiting shortcut and sites buttons"
          git push origin HEAD:fix/root-preview-waiting-sites-20260912
