name: Apply task row deselection root

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-task-row-deselect-root.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch sources
        run: python .github/scripts/fix_task_row_deselect_root.py
      - name: Commit and push
        run: |
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/app.js assets/js/task-bulk-delete-20260912.js assets/js/avatar-final-20260911.js index.html
          git commit -m 'Make task row deselection authoritative'
          git push
