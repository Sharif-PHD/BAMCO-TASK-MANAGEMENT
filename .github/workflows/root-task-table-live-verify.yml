name: Root task table live verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-task-table-live-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait until root-fixed Pages source is live
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          for i in $(seq 1 40); do
            html="$(curl -fsSL "${BASE}?root-table=${GITHUB_SHA}-${i}" || true)"
            app="$(curl -fsSL "${BASE}assets/js/app.js?root-table=${GITHUB_SHA}-${i}" || true)"
            bulk="$(curl -fsSL "${BASE}assets/js/task-bulk-delete-20260912.js?root-table=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'app.js?v=task-table-root-20260912-1' <<<"$html" \
              && ! grep -q '<th>انتخاب</th>' <<<"$html" \
              && grep -q "advance_days||0" <<<"$app" \
              && grep -q '__bamcoTaskBulkDelete20260912V4' <<<"$bulk"; then
              exit 0
            fi
            sleep 10
          done
          echo 'Root-fixed Pages bundle did not become live in time' >&2
          exit 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test actual render path for Kanban and archive
        run: |
          cat > /tmp/live.py <<'PY'
          import asyncio,re,json
          from playwright.async_api import async_playwright
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          def green(c):
              m=re.match(r'rgba?\((\d+),\s*(\d+),\s*(\d+)',c or '')
              if not m:return False
              r,g,b=map(int,m.groups());return g>r and g>b and g-r>=15
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1500,'height':900})
                  await page.goto(BASE+'?root-table-live=1',wait_until='networkidle')
                  await page.wait_for_function("typeof renderTasks==='function' && window.__bamcoTaskBulkDelete20260912V4===true")
                  assert (await page.locator('#kanbanView thead tr').first.locator('th').last.text_content()).strip()=='تعجیل'
                  assert (await page.locator('#archiveView thead tr').first.locator('th').last.text_content()).strip()=='تعجیل'
                  assert await page.locator('th').filter(has_text='انتخاب').count()==0
                  assert await page.locator('[data-bamco-task-select-all]').count()==0
                  await page.evaluate("""() => {
                    state.profile={id:'1',role:'manager',full_name:'مدیر'};
                    state.profiles=[];
                    state.selected={kanban:null,archive:null};
                    state.tasks=[
                      {id:11001,legacy_id:1,title:'کانبان تست',description:'',archived:false,status:'در حال انجام',priority:'متوسط',reminder_days:0,manager_notes:'',advance_days:4},
                      {id:12001,legacy_id:2,title:'آرشیو تست',description:'',archived:true,status:'انجام شده',priority:'متوسط',reminder_days:0,manager_notes:'',delay_days:2,advance_days:6}
                    ];
                    renderTasks(false);renderTasks(true);
                  }""")
                  await page.wait_for_timeout(200)
                  assert await page.locator('#kanbanBody tr[data-task-id="11001"] td').count()==14
                  assert await page.locator('#archiveBody tr[data-task-id="12001"] td').count()==15
                  assert (await page.locator('#kanbanBody tr[data-task-id="11001"] td').last.text_content()).strip()=='۴'
                  assert (await page.locator('#archiveBody tr[data-task-id="12001"] td').last.text_content()).strip()=='۶'
                  assert await page.locator('input.task-pick').count()==0
                  for scope,tid in [('kanban','11001'),('archive','12001')]:
                      await page.evaluate(f"() => document.querySelector('#{scope}Body tr[data-task-id=\"{tid}\"] td:nth-child(2)').dispatchEvent(new MouseEvent('click',{{bubbles:true,cancelable:true}}))")
                      await page.wait_for_function(f"() => window.bamcoTaskSelection.count('{scope}')===1")
                      row=page.locator(f'#{scope}Body tr[data-task-id="{tid}"]')
                      assert await row.evaluate("el=>el.classList.contains('task-selected') && el.getAttribute('aria-selected')==='true'")
                      bg=await row.locator('td').first.evaluate('el=>getComputedStyle(el).backgroundColor')
                      assert green(bg),(scope,bg)
                  assert await page.locator('[data-bamco-task-select-all]').count()==0
                  print(json.dumps({'kanban_last':'تعجیل','archive_last':'تعجیل','select_all':False,'kanban_green':True,'archive_green':True,'status':'passed'},ensure_ascii=False))
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/live.py
